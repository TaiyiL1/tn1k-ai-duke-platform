window.batchAnalyzeReady = async function() {
  const courses = getCourses().filter(c =>
    c.report_fetch_status === 'success' &&
    c.analysis_depth === 'report_deep_ai' &&
    !c.ai_deep_analysis
  );
  if(!courses.length) return;

  const cost = estimateBatchCost(courses.length);
  if(!confirm(`将对 ${courses.length} 节课进行 AI 深度分析。\n\n预计成本约 ¥${cost.toFixed(2)}\n预计耗时 ${Math.ceil(courses.length * 3 / 60)} 分钟\n\n确定开始？`)) return;

  const progressEl = document.getElementById('aiAnalysisProgress');
  const progressFill = document.getElementById('aiProgressFill');
  const progressText = document.getElementById('aiProgressText');
  if(progressEl) progressEl.style.display = 'block';

  let done = 0;
  let successCount = 0;
  let failedCount = 0;
  let statsSyncFailed = false;

  for(const c of courses) {
    // 记录旧状态，避免重复计数
    const oldAiStatus = c.ai_analysis_status;
    // 标记分析中
    await sbClient.from('courses').update({ ai_analysis_status: 'analyzing' }).eq('course_id', c.course_id);
    const result = await callAiAnalysis(c);
    if(result.success) {
      const aiData = result.data;
      const updates = {
        ai_deep_analysis: (aiData.ai_second_opinion || '').substring(0, 500),
        ai_action_suggestions: JSON.stringify(aiData),
        analysis_depth: 'report_deep_ai',
        ai_analysis_status: 'success',
        ai_analysis_error: '',
        risk_level: aiData.risk_level || c.risk_level || '',
        needs_video_review: !!aiData.suggest_video_review,
        needs_audio_transcript: !!aiData.suggest_audio_transcript,
        needs_leader_review: !!aiData.suggest_leader_review,
        updated_at: now()
      };
      if(aiData.risk_level === 'critical') {
        updates.ai_layer = '异常课';
        updates.needs_leader_review = true;
      } else if(aiData.risk_level === 'high' && c.ai_layer === '常规课') {
        updates.ai_layer = '重点提升课';
      }
      await sbClient.from('courses').update(updates).eq('course_id', c.course_id);
      // 批次回写（根据旧状态避免重复计数）
      if(c.import_batch_id) {
        if(oldAiStatus === 'success') {
          // 已是成功状态，不重复计数
        } else if(oldAiStatus === 'failed') {
          // 失败转成功：失败-1，成功+1
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_failed',
            p_delta: -1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_done',
            p_delta: 1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
        } else {
          // pending / analyzing → 成功：成功计数+1
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_done',
            p_delta: 1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
        }
      }
      successCount++;
    } else {
      await sbClient.from('courses').update({
        ai_analysis_status: 'failed',
        ai_analysis_error: result.error || '未知错误',
        updated_at: now()
      }).eq('course_id', c.course_id);
      if(c.import_batch_id) {
        if(oldAiStatus === 'failed') {
          // 已算过失败，不重复计数
        } else if(oldAiStatus === 'success') {
          // 成功转失败（防御性处理）
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_done',
            p_delta: -1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_failed',
            p_delta: 1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
        } else {
          // pending / analyzing → 失败：失败计数+1
          await sbClient.rpc('increment_batch_count', {
            p_batch_id: c.import_batch_id,
            p_field: 'ai_analysis_failed',
            p_delta: 1
          }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
        }
      }
      failedCount++;
    }
    done++;
    const pct = (done / courses.length) * 100;
    if(progressFill) progressFill.style.width = pct + '%';
    if(progressText) progressText.textContent = done + ' / ' + courses.length + '（成功 ' + successCount + '，失败 ' + failedCount + '）';
  }

  // 最终统计同步
  await syncBatchStatsFromCourses();
  await refreshData();
  renderAdmin();
  if(statsSyncFailed) {
    showToast('部分批次统计同步失败，可点击批次管理页的刷新统计手动重算', 'error');
  }

window.closeAISettings = function() {
  const mc = document.getElementById('modalContainer');
  if(mc) mc.innerHTML = '';
};

window.testAIConnection = async function() {
  const statusEl = document.getElementById('aiTestStatus');
  const base = document.getElementById('aiApiBase').value.trim();
  const key = document.getElementById('aiApiKey').value.trim();
  const model = document.getElementById('aiModel').value.trim();

  if(!base || !key || !model) {
    statusEl.innerHTML = '<div class="config-status error">请填写完整配置</div>';
    return;
  }

  statusEl.innerHTML = '<div class="config-status warning">⏳ 正在测试...</div>';
  try {
    const url = base.replace(/\/$/, '') + '/chat/completions';
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: model,
        messages: [{role:'user', content:'ping'}],
        max_tokens: 5
      })
    });
    if(!resp.ok) {
      const err = await resp.text().catch(()=>'');
      statusEl.innerHTML = '<div class="config-status error">连接失败：HTTP ' + resp.status + ' ' + escapeHtml(err.substring(0,80)) + '</div>';
      return;
    }
    statusEl.innerHTML = '<div class="config-status success">✅ 连接成功！模型响应正常。</div>';
  } catch(e) {
    statusEl.innerHTML = '<div class="config-status error">连接失败：' + escapeHtml(e.message) + '</div>';
  }
};

window.saveAISettings = function() {
  const base = document.getElementById('aiApiBase').value.trim();
  const key = document.getElementById('aiApiKey').value.trim();
  const model = document.getElementById('aiModel').value.trim();
  const proxyUrl = (document.getElementById('aiProxyUrl')?.value || '').trim();
  if(!base || !key || !model) {
    alert('请填写完整配置');
    return;
  }
  saveAiConfig({ apiBase: base, apiKey: key, model: model, proxyUrl: proxyUrl });
  closeAISettings();
  alert('✅ AI 配置已保存');
  renderAdmin();
};

function renderOverviewTab(container) {

  const layerStats = layers.map(l => ({
    name: l,

  const totalCount = layerStats.reduce((s, x) => s + x.count, 0) || 1;

  // 五科分布
  const subjects = ['心理健康','趣味阅读','美术','趣味科学','音乐'];
  const subjectStats = subjects.map(s => ({
    name: s,
    count: courses.filter(c => c.subject === s).length
  }));
  const otherCount = courses.filter(c => c.subject && !subjects.includes(c.subject)).length;
  if(otherCount) subjectStats.push({ name: '其他', count: otherCount });
  const subjectMax = Math.max(...subjectStats.map(s => s.count), 1);

          <div class="bar-chart">
            ${layerStats.map((s,i) => `
              <div class="bar-row">
                <div class="bar-label"><span class="tag ${getLayerTagClass(s.name)}">${s.name}</span></div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${(s.count/totalCount)*100}%;background:${layerColors[i]}"></div>
                </div>
                <div class="bar-value">${s.count}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>📚 学科分布</h3></div>
        <div class="card-body">
          <div class="bar-chart">
            ${subjectStats.map((s,i) => `
              <div class="bar-row">
                <div class="bar-label">${s.name}</div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${(s.count/subjectMax)*100}%;background:${['#1677ff','#16a34a','#8b5cf6','#eab308','#f97316','#6b7280'][i%6]}"></div>
                </div>
                <div class="bar-value">${s.count}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="two-col" style="margin-bottom:16px">
      <div class="card">
        <div class="card-header"><h3>⚠️ 风险等级分布</h3></div>
        <div class="card-body">
          <div class="bar-chart">
            ${riskStats.map((s,i) => `
              <div class="bar-row">
                <div class="bar-label" class="${getRiskClass(s.key)}">${s.name}</div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${(s.count/riskMax)*100}%;background:${['#16a34a','#eab308','#f97316','#dc2626'][i]}"></div>
                </div>
                <div class="bar-value">${s.count}</div>
              </div>

let assignState = { selectedCourseIds: new Set(), selectedReviewerId: null, assignLayer: '' };

function renderReviewersTab(container) {
  const reviewers = getReviewers();

  container.innerHTML = `

function renderAssignSubTab(unassignedCourses, reviewers) {
  const subjects = ['全部', ...new Set(unassignedCourses.map(c => c.subject).filter(Boolean))];
  const layers = ['全部', '优秀课候选', '常规课', '重点提升课', '异常课'];
  const filterSub = adminState.assignFilterSubject || '全部';
  const filterLayer = adminState.assignFilterLayer || '全部';

  let filtered = unassignedCourses;
  if(filterSub !== '全部') filtered = filtered.filter(c => c.subject === filterSub);
  if(filterLayer !== '全部') filtered = filtered.filter(c => c.ai_layer === filterLayer);

  const page = adminState.assignPage || 1;
  const pageSize = 20;
  const totalPages = Math.ceil(filtered.length / pageSize) || 1;
  if(page > totalPages) adminState.assignPage = 1;
  const start = (page - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);

  return `
    <div class="filter-bar">
      <select class="form-select" onchange="setAssignFilter('subject', this.value)">
        ${subjects.map(s => `<option value="${s}" ${filterSub===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select class="form-select" onchange="setAssignFilter('layer', this.value)">
        ${layers.map(l => `<option value="${l}" ${filterLayer===l?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-default" onclick="selectAllAssignVisible()">全选当前页</button>
      <span style="font-size:12px;color:var(--color-text-secondary)">已选 ${assignState.selectedCourseIds.size} 节</span>
    </div>

    <div class="assign-layout">
      <!-- 待分配课程 -->
      <div class="assign-panel">
        <div class="assign-panel-header">
          <span>待分配课程（${filtered.length}）</span>
          <span style="font-size:12px;color:var(--color-text-secondary)">已选 ${assignState.selectedCourseIds.size}</span>
        </div>
        <div class="assign-list" style="max-height:450px">
          ${pageData.length ? pageData.map(c => `
            <div class="assign-item ${assignState.selectedCourseIds.has(c.course_id)?'selected':''}" onclick="toggleAssignCourse('${c.course_id}')">
              <input type="checkbox" ${assignState.selectedCourseIds.has(c.course_id)?'checked':''} style="margin-right:8px;pointer-events:none">
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(c.course_name||'-')}</div>
                <div style="font-size:11px;color:var(--color-text-muted);margin-top:2px">${escapeHtml(c.subject||'-')} · ${escapeHtml(c.teacher_name||'-')} · ${c.ai_score != null ? c.ai_score+'分' : '-'}</div>
              </div>
              <span class="tag ${getLayerTagClass(c.ai_layer)}">${c.ai_layer}</span>
            </div>
          `).join('') : '<div style="padding:24px;text-align:center;color:var(--color-text-muted);font-size:13px">暂无待分配课程</div>'}
        </div>
        <div class="pagination" style="padding:8px 12px">
          <span style="font-size:12px">第 ${page} / ${totalPages} 页</span>
          <div class="pagination-btns">
            <button ${page<=1?'disabled':''} onclick="goAssignPage(${page-1})">‹</button>
            <button ${page>=totalPages?'disabled':''} onclick="goAssignPage(${page+1})">›</button>
          </div>
        </div>
      </div>

      <!-- 督课官列表 -->
      <div class="assign-panel">
        <div class="assign-panel-header">
          <span>选择督课官</span>
        </div>
        <div class="assign-list" style="max-height:450px">
          ${reviewers.length ? reviewers.filter(r => r.status === '启用').map(r => `
            <div class="assign-item ${assignState.selectedReviewerId===r.reviewer_id?'selected':''}" onclick="selectReviewer('${r.reviewer_id}')">
              <div style="flex:1">
                <div style="font-size:13px;font-weight:500">${escapeHtml(r.reviewer_name)} <span class="tag tag-blue" style="margin-left:6px">${escapeHtml(r.subject||'-')}</span></div>

              </div>
            </div>
          `).join('') : '<div style="padding:24px;text-align:center;color:var(--color-text-muted);font-size:13px">暂无督课官</div>'}
        </div>
        <div class="assign-actions">
          <button class="btn btn-default" onclick="clearAssignSelection()">清空选择</button>
          <button class="btn btn-primary" onclick="doAssign()" ${!assignState.selectedReviewerId || assignState.selectedCourseIds.size===0?'disabled':''}>
            分配 ${assignState.selectedCourseIds.size} 节课
          </button>
        </div>
      </div>
    </div>
  `;
}

window.selectAllAssignVisible = function() {
  const unassigned = getCourses().filter(c => c.review_status === '未分配' && c.need_review);
  let filtered = unassigned;
  if(adminState.assignFilterSubject && adminState.assignFilterSubject !== '全部') filtered = filtered.filter(c => c.subject === adminState.assignFilterSubject);
  if(adminState.assignFilterLayer && adminState.assignFilterLayer !== '全部') filtered = filtered.filter(c => c.ai_layer === adminState.assignFilterLayer);
  const page = adminState.assignPage || 1;

window.selectReviewer = function(id) { assignState.selectedReviewerId = id; renderAdmin(); };
window.clearAssignSelection = function() { assignState.selectedCourseIds.clear(); assignState.selectedReviewerId = null; renderAdmin(); };

window.doAssign = async function() {
  if(!assignState.selectedReviewerId || assignState.selectedCourseIds.size === 0) return;
  const reviewer = getReviewers().find(r => r.reviewer_id === assignState.selectedReviewerId);
  if(!reviewer) return;
  const ids = Array.from(assignState.selectedCourseIds);
  if(!confirm(`确定将 ${ids.length} 节课分配给 ${reviewer.reviewer_name}（${reviewer.subject}）？`)) return;

  showLoading('正在分配...');
  try {
    const { error } = await sbClient.from('courses').update({
      assigned_reviewer: reviewer.reviewer_name,
      reviewer_token: reviewer.token,
      review_status: '待复核',
      updated_at: now()
    }).in('course_id', ids);

    if(error) throw error;

    // 更新督课官已分配计数
    const newCount = (reviewer.assigned_count || 0) + ids.length;
    await sbClient.from('reviewers').update({ assigned_count: newCount }).eq('reviewer_id', reviewer.reviewer_id);

    await loadAllData();
    assignState.selectedCourseIds.clear();
    assignState.selectedReviewerId = null;
    hideLoading();
    alert('✅ 分配成功');
    renderAdmin();
  } catch(e) {
    hideLoading();
    alert('分配失败：' + e.message);
  }
};

window.addReviewer = async function() {
  const name = prompt('请输入督课官姓名：');
  if(!name) return;
  const subject = prompt('请输入督课官负责科目（心理健康/趣味阅读/美术/趣味科学/音乐）：', '心理健康');
  if(!subject) return;
  const max = parseInt(prompt('请输入任务上限（默认20）：', '20')) || 20;

  const reviewer = {
    reviewer_id: 'R' + Date.now().toString(36),
    reviewer_name: name,
    subject: subject,
    token: uuid(),
    max_tasks: max,
    assigned_count: 0,
    completed_count: 0,
    status: '启用'
  };

  showLoading('正在新增...');
  try {
    await sbClient.from('reviewers').insert(reviewer);
    await loadAllData();
    hideLoading();
    alert('✅ 新增成功\n\n督课官链接：' + getPublicUrl() + '#reviewer/' + reviewer.token);
    renderAdmin();
  } catch(e) {
    hideLoading();
    alert('新增失败：' + e.message);
  }
};

window.toggleReviewer = async function(id) {
  const r = getReviewers().find(x => x.reviewer_id === id);
  if(!r) return;
  const newStatus = r.status === '启用' ? '禁用' : '启用';
  if(!confirm(`确定${newStatus === '启用' ? '启用' : '禁用'}督课官「${r.reviewer_name}」吗？`)) return;
  showLoading('处理中...');
  try {
    await sbClient.from('reviewers').update({ status: newStatus }).eq('reviewer_id', id);
    await loadAllData();
    hideLoading();
    renderAdmin();
  } catch(e) {
    hideLoading();
    alert('操作失败：' + e.message);
  }
};

  return localStorage.getItem('dudao_public_url') || location.origin + location.pathname;

window.copyLink = function(token) {
  const url = getPublicUrl() + '#reviewer/' + token;
  navigator.clipboard.writeText(url).then(() => {
    alert('✅ 督课官链接已复制：\n' + url);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ 督课官链接已复制：\n' + url);
  });
};

// AI 分析状态显示
function getAiStatusDot(status) {
  const colors = {
    'pending': 'background:#9ca3af',
    'analyzing': 'background:var(--color-warning)',
    'success': 'background:var(--color-success)',
    'failed': 'background:var(--color-danger)',
    'none': 'background:transparent'
  };
  return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;' + (colors[status]||colors.pending) + '"></span>';
}
function getAiStatusLabel(status) {
  const map = { pending:'待分析', analyzing:'分析中', success:'已完成', failed:'失败', none:'无需分析' };
  return map[status] || status || '-';
}

function coursesToSheet(courses, includeAi = false) {
  return courses.map(c => {
    const row = {
      '课程编号': c.course_id || '',
      '课程名称': c.course_name || '',
      '科目': c.subject || '',
      '授课老师': c.teacher_name || '',
      '班级': c.class_name || '',
      '上课时间': c.lesson_time || '',
      '时长(分钟)': c.duration || '',
      'AI分数': c.ai_score ?? '',
      'AI分层': c.ai_layer || '',
      '人工复核分类': c.final_layer || '',
      '风险等级': c.risk_level || '',
      '督课官': c.assigned_reviewer || '',
      '状态': c.review_status || '',
      '是否跟进': c.need_followup ? '是' : '否',
      '教师反馈': c.teacher_feedback || '',
      '内部备注': c.internal_notes || '',
      '报告链接': c.classin_report_url || c.ai_report_url || '',
      '回放链接': c.classin_replay_url || c.replay_url || '',
      '报告读取状态': getFetchStatusLabel(c.report_fetch_status),
      '分析深度': getDepthLabel(c.analysis_depth),
      '导入批次': c.import_batch_id || ''
    };
    if(includeAi && c.ai_action_suggestions) {
      const s = safeJsonParse(c.ai_action_suggestions, {});
      row['AI摘要'] = s.course_summary || '';
      row['AI深度意见'] = s.ai_second_opinion || '';
      row['人工复核问题'] = (s.manual_review_issues || []).join('；');
      row['督课官关注重点'] = (s.reviewer_focus_points || []).join('；');
      row['教师改进建议'] = (s.teacher_improvement_suggestions || []).join('；');
      row['需视频复核'] = s.suggest_video_review ? '是' : '否';
      row['需负责人复审'] = s.suggest_leader_review ? '是' : '否';
    }
    return row;
  });
}

function downloadExcel(data, filename) {
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename);
}

window.exportAll = function() {
  downloadExcel(coursesToSheet(getCourses(), true), '全部课程数据_v1.0.xlsx');
};

window.exportByLayer = function(layer) {
  const courses = getCourses().filter(c => (c.final_layer || c.ai_layer) === layer);
  downloadExcel(coursesToSheet(courses, true), `${layer}_${courses.length}节.xlsx`);
};

window.exportAiAnalysis = function() {
  const courses = getCourses().filter(c => c.ai_deep_analysis && c.ai_deep_analysis !== '');
  downloadExcel(coursesToSheet(courses, true), `AI深度分析结果_${courses.length}节.xlsx`);
};

window.exportByBatch = function(batchId) {
  const batch = getBatches().find(b => b.id === batchId);
  const courses = getCourses().filter(c => c.import_batch_id === batchId);
  downloadExcel(coursesToSheet(courses, true), `批次_${batch?.file_name||batchId}.xlsx`);
};

let reviewerState = { viewMode: 'list', currentCourseId: null, reviewerInfo: null, reviewerCourses: [] };

async function renderReviewer(token) {
  const info = await rpcGetReviewerInfo(token);
  if(!info) {
    app.innerHTML = `
      <div style="max-width:400px;margin:120px auto;text-align:center;padding:20px">
        <div style="font-size:64px;margin-bottom:16px">🔒</div>
        <h2 style="font-size:18px;margin-bottom:8px">督课官链接无效</h2>
        <p style="color:var(--color-text-secondary);font-size:13px">请检查链接是否正确，或联系管理员获取新的链接。</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="location.hash='#admin'">进入管理员端</button>
      </div>
    `;
    return;
  }

  const courses = await rpcGetReviewerCourses(token);
  reviewerState.reviewerInfo = info;
  reviewerState.reviewerCourses = courses;

  if(reviewerState.viewMode === 'detail' && reviewerState.currentCourseId) {
    renderReviewerDetail(info, courses, token);
  } else {
    renderReviewerList(info, courses, token);
  }
}

function renderReviewerList(reviewer, courses, token) {
  const pending = courses.filter(c => c.review_status === '待复核').length;
  const completed = courses.filter(c => c.review_status === '已完成' || c.review_status === '需负责人复审').length;
  const highRisk = courses.filter(c => c.risk_level === 'high' || c.risk_level === 'critical').length;

  app.innerHTML = `
    <header class="reviewer-header">
      <h1>👋 您好，${escapeHtml(reviewer.reviewer_name)}</h1>
      <p>科目：${escapeHtml(reviewer.subject || '-')} · 已完成 ${reviewer.completed_count||0} / 上限 ${reviewer.max_tasks}</p>
    </header>
    <div class="reviewer-content">
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card"><div class="stat-label">待复核</div><div class="stat-value text-primary">${pending}</div></div>
        <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value text-success">${completed}</div></div>
        <div class="stat-card"><div class="stat-label">高风险</div><div class="stat-value text-danger">${highRisk}</div></div>
      </div>

      <div class="card">
        <div class="card-header"><h3>📋 我的任务列表</h3></div>
        <div class="card-body" style="padding:0">
          <div class="table-wrap" style="border:none;border-radius:0">
            <table>
              <thead>
                <tr><th>课程名称</th><th>科目</th><th>AI分数</th><th>分层</th><th>风险</th><th>状态</th><th>操作</th></tr>
              </thead>
              <tbody>
                ${courses.length ? courses.map(c => `
                  <tr>
                    <td style="font-weight:500">${escapeHtml(c.course_name||'-')}</td>
                    <td>${escapeHtml(c.subject||'-')}</td>
                    <td style="font-family:var(--font-mono)">${c.ai_score != null ? c.ai_score : '-'}</td>
                    <td><span class="tag ${getLayerTagClass(c.ai_layer)}">${c.ai_layer}</span></td>
                    <td class="${getRiskClass(c.risk_level)}">${getRiskLabel(c.risk_level)}</td>
                    <td><span class="tag ${getStatusTagClass(c.review_status)}">${c.review_status}</span></td>
                    <td><button class="btn btn-sm btn-default" onclick="reviewerViewDetail('${c.course_id}')">${c.review_status==='已完成'||c.review_status==='需负责人复审'?'查看':'复核'}</button></td>
                  </tr>
                `).join('') : '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--color-text-muted)">暂无任务</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  `;
}

window.reviewerBack = async function() {
  reviewerState.viewMode = 'list';
  reviewerState.currentCourseId = null;
  const token = reviewerState.reviewerInfo?.token;
  if(token) {
    reviewerState.reviewerCourses = await rpcGetReviewerCourses(token);
    renderReviewerList(reviewerState.reviewerInfo, reviewerState.reviewerCourses, token);
  }
};

window.submitReview = async function(e, courseId, token) {
  e.preventDefault();
  const finalLayer = document.getElementById('reviewLayer').value;
  const needFollowup = document.getElementById('needFollowup').checked;
  const hasRisk = document.getElementById('hasRisk').checked;
  const riskType = document.getElementById('riskType').value.trim();
  const feedback = document.getElementById('teacherFeedback').value.trim();
  const notes = document.getElementById('internalNotes').value.trim();

  if(!finalLayer) { alert('请选择最终分层'); return; }
  if(!feedback) { alert('请填写教师反馈'); return; }

  if((finalLayer === '暂停授课建议' || finalLayer === '清退复审建议') && !confirm('⚠️ 您选择了「'+finalLayer+'」，此操作将自动提交负责人复审。确定提交吗？')) {
    return;
  }

  showLoading('正在提交...');
  const result = await rpcSubmitReview(token, courseId, finalLayer, needFollowup, hasRisk, riskType, feedback, notes);
  hideLoading();

  if(result.success) {
    alert('✅ 复核提交成功！');
    reviewerState.viewMode = 'list';
    reviewerState.currentCourseId = null;
    render();
  } else {
    alert('提交失败：' + result.error);
  }
};

  renderAdmin();
};
window.clearSelection = function() { adminState.selectedCourses.clear(); renderAdmin(); };

// 旧版 viewCourseDetail 兼容
window.viewCourseDetail = function(courseId) {
  viewCourseDetailAdmin(courseId);
};

// =========== INITIALIZATION ===========
window.addEventListener('DOMContentLoaded', initApp);

function initApp() {
  // 1. 初始化 Supabase
  if(initSupabase()) {
    dbReady = true;
  }

  // 2. 判断路由
  const route = getRoute();

  if(!sbClient) {
    // 未配置数据库 → 显示配置页
    renderConfigPage();
    return;
  }

  // 3. 渲染
  render();
}

// 处理 hash 变化
window.addEventListener('hashchange', () => {
  adminAuthenticated = false; // 切换路由重置认证
  reviewerState.viewMode = 'list';
  reviewerState.currentCourseId = null;
  if(sbClient) render();
});

// 如果 DOMContentLoaded 已经触发，手动初始化
if(document.readyState === 'interactive' || document.readyState === 'complete') {
  initApp();
}
</script>
</body>
</html>
