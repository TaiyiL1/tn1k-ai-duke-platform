<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI辅助督课深度分析平台 v1.0 - 童年一课云教室</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-bg:#F6F8FB;
  --color-surface:#FFFFFF;
  --color-text:#152033;
  --color-text-secondary:#637089;
  --color-text-muted:#8C95A6;
  --color-primary:#1677ff;
  --color-primary-hover:#4096ff;
  --color-primary-bg:#e6f4ff;
  --color-border:#E6EAF2;
  --color-border-light:#F0F3F8;
  --color-success:#16A37B;
  --color-success-bg:#f0fdf4;
  --color-warning:#E6A23C;
  --color-warning-bg:#fdf6ec;
  --color-danger:#E53935;
  --color-danger-bg:#fef2f2;
  --color-info:#1677ff;
  --color-info-bg:#e6f4ff;
  --color-purple:#8b5cf6;
  --color-purple-bg:#f5f3ff;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);
  --spacing-xs:4px;
  --spacing-sm:8px;
  --spacing-md:16px;
  --spacing-lg:24px;
  --spacing-xl:32px;
}
html{font-size:14px;line-height:1.6}
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);min-height:100vh}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;outline:none;font-size:inherit}
button:focus-visible{box-shadow:0 0 0 2px var(--color-primary)}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px var(--color-primary-bg)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--color-border)}
th{font-weight:600;color:var(--color-text-secondary);background:var(--color-bg);position:sticky;top:0;z-index:1;font-size:13px;white-space:nowrap}
td{font-size:13px}
tbody tr:hover{background:var(--color-primary-bg)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.tag-green{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.tag-blue{background:#e6f4ff;color:#1677ff;border:1px solid #bae0ff}
.tag-orange{background:#fff7e6;color:#d46b08;border:1px solid #ffd591}
.tag-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.tag-gray{background:#f5f5f5;color:#8c8c8c;border:1px solid #e8e8e8}
.tag-yellow{background:#fefce8;color:#a16207;border:1px solid #fde68a}
.tag-purple{background:#f5f3ff;color:#8b5cf6;border:1px solid #ddd6fe}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .15s ease;border:1px solid transparent}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn-default{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border)}
.btn-default:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-success{background:var(--color-success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--color-danger);color:#fff}
.btn-danger:hover{background:#c62828}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-link{background:none;color:var(--color-primary);padding:4px 8px;border:none}
.btn-link:hover{background:var(--color-primary-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:13px;background:var(--color-surface);color:var(--color-text);transition:border-color .15s}
.form-textarea{min-height:80px;resize:vertical;line-height:1.6}
.card{background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid var(--color-border-light)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:20px}

/* Header */
.app-header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:0 var(--spacing-lg);height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.app-header h1{font-size:16px;font-weight:700;color:var(--color-text);display:flex;align-items:center;gap:8px}
.app-header h1 .logo-icon{width:28px;height:28px;background:var(--color-primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.role-badge{background:var(--color-primary-bg);color:var(--color-primary);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500}
.version-badge{background:var(--color-purple-bg);color:var(--color-purple);padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--spacing-md);margin-bottom:var(--spacing-lg)}
.stat-card{background:var(--color-surface);border-radius:var(--radius-md);padding:16px 20px;border:1px solid var(--color-border-light);box-shadow:var(--shadow-sm)}
.stat-card .stat-label{font-size:12px;color:var(--color-text-muted);margin-bottom:4px}
.stat-card .stat-value{font-size:28px;font-weight:700;font-family:var(--font-mono);line-height:1.2}
.stat-card .stat-value.text-primary{color:var(--color-primary)}
.stat-card .stat-value.text-success{color:var(--color-success)}
.stat-card .stat-value.text-warning{color:var(--color-warning)}
.stat-card .stat-value.text-danger{color:var(--color-danger)}
.stat-card .stat-value.text-purple{color:var(--color-purple)}
.stat-card .stat-sub{font-size:11px;color:var(--color-text-muted);margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--color-border);margin-bottom:var(--spacing-lg);overflow-x:auto}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;color:var(--color-text-secondary);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;cursor:pointer}
.tab-btn:hover{color:var(--color-primary)}
.tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:var(--spacing-sm);margin-bottom:var(--spacing-md);align-items:center}
.filter-bar .form-select{width:auto;min-width:120px;padding:6px 10px;font-size:12px}
.filter-bar .form-input{width:auto;min-width:120px;padding:6px 10px;font-size:12px}

/* Upload area */
.upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;transition:all .15s;cursor:pointer;background:var(--color-surface)}
.upload-area:hover,.upload-area.dragover{border-color:var(--color-primary);background:var(--color-primary-bg)}
.upload-area .upload-icon{font-size:40px;margin-bottom:12px;color:var(--color-text-muted)}
.upload-area .upload-text{font-size:14px;color:var(--color-text-secondary);margin-bottom:4px}
.upload-area .upload-hint{font-size:12px;color:var(--color-text-muted)}

/* Preview table */
.preview-table-wrap{max-height:400px;overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);margin:16px 0}
.preview-table-wrap table{font-size:12px}
.preview-table-wrap th{font-size:11px}

/* Table wrapper */
.table-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:13px;color:var(--color-text-secondary)}
.pagination-btns{display:flex;gap:4px}
.pagination-btns button{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pagination-btns button:hover{border-color:var(--color-primary);color:var(--color-primary)}
.pagination-btns button.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.pagination-btns button:disabled{opacity:.4;cursor:not-allowed}

/* Reviewer page */
.reviewer-header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:16px var(--spacing-lg)}
.reviewer-header h1{font-size:18px;font-weight:700}
.reviewer-header p{color:var(--color-text-secondary);font-size:13px;margin-top:4px}
.reviewer-content{max-width:1200px;margin:0 auto;padding:var(--spacing-lg)}
.course-detail{max-width:900px;margin:0 auto}
.course-detail .back-btn{margin-bottom:var(--spacing-md)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--spacing-md)}
.info-item{padding:12px 0}
.info-item .info-label{font-size:12px;color:var(--color-text-muted);margin-bottom:4px}
.info-item .info-value{font-size:14px;font-weight:500}
.score-display{font-size:48px;font-weight:800;font-family:var(--font-mono);line-height:1}
.score-display.score-high{color:var(--color-success)}
.score-display.score-mid{color:var(--color-primary)}
.score-display.score-low{color:var(--color-warning)}
.score-display.score-bad{color:var(--color-danger)}
.alert-box{padding:16px 20px;border-radius:var(--radius-md);margin:var(--spacing-md) 0;font-size:13px;line-height:1.8}
.alert-box.alert-warning{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-box.alert-danger{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-box.alert-info{background:#e6f4ff;border:1px solid #bae0ff;color:#1e40af}
.alert-box.alert-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.alert-box strong{color:inherit}
.switch-group{display:flex;align-items:center;gap:8px}
.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#d1d5db;border-radius:11px;transition:.2s;cursor:pointer}
.switch .slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--color-primary)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.link-box{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--color-primary-bg);color:var(--color-primary);border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-top:8px}
.link-box:hover{text-decoration:none}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-secondary);font-size:12px;cursor:pointer}
.copy-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.token-display{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);word-break:break-all}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:720px;max-height:90vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--color-surface);z-index:1}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:var(--radius-sm);border:none;background:none;font-size:18px;color:var(--color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--color-bg)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--color-surface);z-index:1}
.empty-state{text-align:center;padding:48px 24px;color:var(--color-text-muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}
.main-content{padding:var(--spacing-lg);max-width:1400px;margin:0 auto}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-md)}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--spacing-md)}
.checkbox-cell{width:40px;text-align:center}
.sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:var(--spacing-sm);font-size:12px;color:var(--color-text-secondary);flex-wrap:wrap}
.sort-bar button{font-size:12px;padding:4px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer}
.sort-bar button:hover,.sort-bar button.active{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-bg)}

/* v1.0 新增样式 */
/* 进度条 */
.progress-bar{height:8px;background:var(--color-border-light);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--color-primary);transition:width .3s ease;border-radius:4px}
.progress-bar-fill.success{background:var(--color-success)}
.progress-bar-fill.warning{background:var(--color-warning)}
.progress-bar-fill.danger{background:var(--color-danger)}

/* 状态点 */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.pending{background:#9ca3af}
.status-dot.fetching{background:#eab308;animation:pulse 1s infinite}
.status-dot.success{background:#16a34a}
.status-dot.failed{background:#dc2626}
.status-dot.none{background:#d1d5db}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 风险等级 */
.risk-low{color:#16a34a}
.risk-medium{color:#eab308}
.risk-high{color:#f97316}
.risk-critical{color:#dc2626}

/* 两栏详情布局 */
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-lg)}
.detail-left,.detail-right{display:flex;flex-direction:column;gap:var(--spacing-md)}

/* 建议列表 */
.suggestion-list{list-style:none;padding:0}
.suggestion-list li{padding:10px 14px;background:var(--color-bg);border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px;line-height:1.6;position:relative;padding-left:28px}
.suggestion-list li::before{content:'💡';position:absolute;left:10px;top:10px;font-size:14px}

/* 批次卡片 */
.batch-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.batch-card:hover{border-color:var(--color-primary)}
.batch-info .batch-name{font-weight:600;font-size:14px;margin-bottom:4px}
.batch-info .batch-meta{font-size:12px;color:var(--color-text-muted)}
.batch-stats{display:flex;gap:16px;font-size:12px;color:var(--color-text-secondary)}
.batch-stats strong{color:var(--color-text);font-family:var(--font-mono);font-size:14px}

/* 图表容器 - 纯CSS条形图 */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:100px;font-size:12px;color:var(--color-text-secondary);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:var(--color-border-light);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;min-width:2px}
.bar-value{width:50px;font-size:12px;font-weight:600;font-family:var(--font-mono);text-align:right;flex-shrink:0}

/* 饼图容器 - 纯CSS饼图 */
.pie-chart-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pie-chart{width:160px;height:160px;border-radius:50%;position:relative;flex-shrink:0}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.pie-legend-color{width:12px;height:12px;border-radius:3px}

/* 队列卡片 */
.queue-card{padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--color-surface)}
.queue-card .queue-info{flex:1;min-width:0}
.queue-card .queue-name{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-card .queue-sub{font-size:11px;color:var(--color-text-muted);margin-top:2px}

/* 设置面板 */
.settings-section{margin-bottom:24px}
.settings-section h4{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--color-border-light)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--color-border-light)}
.settings-row .settings-label{font-size:13px}
.settings-row .settings-desc{font-size:11px;color:var(--color-text-muted);margin-top:2px}

/* 成本估算 */
.cost-estimate{padding:12px 16px;background:var(--color-purple-bg);border:1px solid #ddd6fe;border-radius:var(--radius-sm);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.cost-estimate .cost-amount{font-size:20px;font-weight:700;color:var(--color-purple);font-family:var(--font-mono)}

/* 分析层级徽章 */
.depth-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}
.depth-basic{background:#f3f4f6;color:#6b7280}
.depth-deep{background:#dbeafe;color:#1d4ed8}
.depth-video{background:#fef3c7;color:#92400e}
.depth-audio{background:#fae8ff;color:#a21caf}
.depth-manual{background:#fee2e2;color:#991b1b}

/* 侧栏详情 */
.sidebar-detail{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
.sidebar-detail-header{padding:16px 20px;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:var(--color-surface);z-index:1;display:flex;justify-content:space-between;align-items:center}

@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .two-col,.three-col,.detail-layout{grid-template-columns:1fr}
  .filter-bar{flex-direction:column}
  .filter-bar .form-select,.filter-bar .form-input{width:100%}
  .tabs{overflow-x:auto}
}
@media print{
  .app-header,.tabs,.filter-bar,.btn,.upload-area{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Config Page Styles */
.config-page{max-width:640px;margin:60px auto;padding:0 var(--spacing-lg)}
.config-page .config-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px}
.config-page .config-subtitle{text-align:center;color:var(--color-text-secondary);font-size:14px;margin-bottom:32px}
.config-page .config-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--color-border-light);padding:32px}
.config-page .config-actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.config-page .config-status{text-align:center;padding:12px;border-radius:var(--radius-sm);margin-top:16px;font-size:13px}
.config-page .config-status.success{background:var(--color-success-bg);color:var(--color-success)}
.config-page .config-status.error{background:var(--color-danger-bg);color:var(--color-danger)}
.config-page .config-status.warning{background:var(--color-warning-bg);color:var(--color-warning)}

<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">AI辅助督课深度分析平台 v1.0 - 童年一课云教室</h1>
<main id="app"></main>
<script>
// ============================================================
// v1.0 AI 辅助督课深度分析平台
// ============================================================

// =========== SUPABASE DATA LAYER ===========
let sbClient = null;
let dbReady = false;
let dbCache = { courses: [], reviewers: [], logs: [], batches: [] };
let dbLoading = false;
let authUser = null;

function initSupabase() {
  const url = localStorage.getItem('dudao_sb_url');
  const key = localStorage.getItem('dudao_sb_key');
  if(url && key) {
    try {
      sbClient = window.supabase.createClient(url, key, {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      });
      return true;
    } catch(e) {
      console.error('Supabase init error:', e);
      return false;
    }
  }
  return false;
}

// =========== AUTH HELPERS ===========
async function getAuthUser() {
  if(!sbClient) return null;
  try {
    const { data } = await sbClient.auth.getUser();
    authUser = data.user;
    return data.user;
  } catch(e) {
    console.error('getAuthUser error:', e);
    return null;
  }
}

async function adminSignIn(email, password) {
  if(!sbClient) return { error: { message: '数据库未初始化' } };
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if(data && data.user) authUser = data.user;
  return { data, error };
}

async function adminSignOut() {
  if(!sbClient) return;
  await sbClient.auth.signOut();
  authUser = null;
}

// =========== REVIEWER RPC (督课官端专用) ===========
async function rpcGetReviewerInfo(token) {
  if(!sbClient || !token) return null;
  try {
    const { data, error } = await sbClient.rpc('get_reviewer_info', { p_token: token });
    if(error) { console.error('rpcGetReviewerInfo error:', error); return null; }
    return data && data.length > 0 ? data[0] : null;
  } catch(e) {
    console.error('rpcGetReviewerInfo exception:', e);
    return null;
  }
}

async function rpcGetReviewerCourses(token) {
  if(!sbClient || !token) return [];
  try {
    const { data, error } = await sbClient.rpc('get_reviewer_courses', { p_token: token });
    if(error) { console.error('rpcGetReviewerCourses error:', error); return []; }
    return data || [];
  } catch(e) {
    console.error('rpcGetReviewerCourses exception:', e);
    return [];
  }
}

async function rpcSubmitReview(token, courseId, finalLayer, needFollowup, hasRisk, riskType, feedback, notes) {
  if(!sbClient || !token) return { success: false, error: '数据库未初始化' };
  try {
    const { data, error } = await sbClient.rpc('submit_review', {
      p_token: token,
      p_course_id: courseId,
      p_final_layer: finalLayer,
      p_need_followup: needFollowup,
      p_has_risk: hasRisk,
      p_risk_type: riskType,
      p_teacher_feedback: feedback,
      p_internal_notes: notes
    });
    if(error) return { success: false, error: error.message };
    return { success: data === true };
  } catch(e) {
    return { success: false, error: e.message };
  }
}

// =========== ADMIN DATA LOAD ===========
async function loadAllData() {
  if(!sbClient) return dbCache;
  try {
    // 前三个是 v0.5 必需表，最后一个是 v1.0 新增表（可能不存在，单独 catch 降级）
    const [coursesRes, reviewersRes, logsRes] = await Promise.all([
      sbClient.from('courses').select('*').order('created_at', {ascending:false}),
      sbClient.from('reviewers').select('*'),
      sbClient.from('review_logs').select('*').order('submitted_at', {ascending:false})
    ]);
    dbCache.courses = coursesRes.data || [];
    dbCache.reviewers = reviewersRes.data || [];
    dbCache.logs = logsRes.data || [];

    // import_batches 表（v1.0 新增，v0.5 可能不存在）
    try {
      const { data: batchData, error: batchErr } = await sbClient.from('import_batches').select('*').order('imported_at', {ascending:false}).limit(50);
      dbCache.batches = batchData || [];
    } catch(batchE) {
      dbCache.batches = [];
    }
  } catch(e) {
    console.error('loadAllData error:', e);
  }
  return dbCache;
}

function getCourses() { return dbCache.courses; }
function getReviewers() { return dbCache.reviewers; }
function getLogs() { return dbCache.logs; }
function getBatches() { return dbCache.batches; }

async function refreshData() {
  if(!sbClient) return;
  await loadAllData();
}

// =========== UTILITY FUNCTIONS ===========
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x'? r : (r&0x3|0x8)).toString(16);
  });
}
function now() { return new Date().toISOString(); }
function formatDate(iso) {
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(str) {
  if(str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function debounce(fn, wait) {
  let t; return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
}
function safeJsonParse(val, fallback) {
  if(val == null) return fallback;
  if(typeof val === 'object') return val;
  if(typeof val === 'string') {
    if(val === '') return fallback;
    try { return JSON.parse(val); } catch(e) { return fallback; }
  }
  return fallback;
}
// --- Toast 提示工具 ---
function showToast(msg, type) {
  const existing = document.getElementById('toastContainer');
  if(existing) existing.remove();
  const c = document.createElement('div');
  c.id = 'toastContainer';
  c.style.cssText = 'position:fixed;top:20px;right:20px;z-index:99999;padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,0.2);max-width:360px;';
  if(type === 'error') {
    c.style.background = '#fee2e2';
    c.style.color = '#991b1b';
    c.style.border = '1px solid #fca5a5';
  } else if(type === 'success') {
    c.style.background = '#dcfce7';
    c.style.color = '#166534';
    c.style.border = '1px solid #86efac';
  } else {
    c.style.background = '#fff7ed';
    c.style.color = '#92400e';
    c.style.border = '1px solid #fdba74';
  }
  c.textContent = msg;
  document.body.appendChild(c);
  setTimeout(() => { c.style.opacity = '0'; c.style.transition = 'opacity 0.3s'; }, 2700);
  setTimeout(() => { if(c.parentNode) c.parentNode.removeChild(c); }, 3000);
}


// =========== SUBJECT DETECTION ===========
const SUBJECT_KEYWORDS = {
  '心理健康': ['心理','健康','情绪','心灵'],
  '趣味阅读': ['阅读','语文','读书','绘本'],
  '美术': ['美术','绘画','画画','艺术','画'],
  '趣味科学': ['科学','实验','科普','STEM'],
  '音乐': ['音乐','唱歌','声乐','乐器']
};

function detectSubject(text) {
  if(!text) return null;
  const t = text.toLowerCase();
  for(const [subject, keywords] of Object.entries(SUBJECT_KEYWORDS)) {
    for(const kw of keywords) {
      if(t.includes(kw.toLowerCase())) return subject;
    }
  }
  return null;
}

function detectSubjectFromFields(className, classLabel, courseName) {
  // 优先级：课堂标签 > 班级名称 > 课堂名称
  if(classLabel) {
    const s = detectSubject(classLabel);
    if(s) return { subject: s, from: 'class_label' };
  }
  if(className) {
    const s = detectSubject(className);
    if(s) return { subject: s, from: 'class_name' };
  }
  if(courseName) {
    const s = detectSubject(courseName);
    if(s) return { subject: s, from: 'classroom_name' };
  }
  return { subject: '未识别', from: 'undetected' };
}

// =========== CLASSIFICATION (v1.0 6 分层) ===========
const HIGH_RISK_KEYWORDS = ['不当','辱骂','体罚','违规','性骚扰','安全','威胁','恐吓','侮辱','歧视','暴力','打架','受伤','危险'];
const LOW_INTERACTION_KEYWORDS = ['互动','参与度低','沉默','冷场','走神','注意力不集中','发呆','低头','没互动'];

function classifyCourse(course) {
  const score = Number(course.ai_score);
  const hasReport = !!(course.ai_report_url && course.ai_report_url !== '');
  const hasReplay = !!(course.replay_url && course.replay_url !== '');
  const issues = (course.ai_issues || course.classin_ai_issues || '').toString();
  const reportText = (course.report_raw_text || '').toString();
  const combinedText = (issues + ' ' + reportText).toLowerCase();

  // 无 AI 报告
  if(!hasReport || isNaN(score)) {
    return { layer: '异常课', reason: '无AI报告或分数无效', risk: 'medium', depth: 'basic_report_only' };
  }

  // 高风险关键词检测
  const hasHighRisk = HIGH_RISK_KEYWORDS.some(kw => combinedText.includes(kw));
  if(hasHighRisk) {
    return { layer: '异常课', reason: '含高风险关键词，需负责人复审', risk: 'critical', depth: 'manual_review_required', needsLeaderReview: true };
  }

  // 分数 < 40 → 异常课/高风险
  if(score < 40) {
    return { layer: '异常课', reason: 'AI分数低于40分', risk: 'high', depth: 'report_deep_ai' };
  }

  // 分数 < 60 → 重点提升课
  if(score < 60) {
    return { layer: '重点提升课', reason: 'AI分数低于60分', risk: 'medium', depth: 'report_deep_ai' };
  }

  // 含低互动关键词 → 重点提升课
  const hasLowInteraction = LOW_INTERACTION_KEYWORDS.some(kw => combinedText.includes(kw));
  if(hasLowInteraction && score < 75) {
    return { layer: '重点提升课', reason: '存在互动不足问题', risk: 'medium', depth: 'report_deep_ai' };
  }

  // 分数 > 85 且无严重问题 → 优秀课候选
  if(score >= 85 && !hasHighRisk) {
    return { layer: '优秀课候选', reason: 'AI分数优秀且无严重问题', risk: 'low', depth: 'basic_report_only' };
  }

  // 其余 → 常规课
  return { layer: '常规课', reason: 'AI分数中等，无明显问题', risk: 'low', depth: 'basic_report_only' };
}

function getLayerTagClass(layer) {
  const map = {
    "优秀课候选":"tag-green",
    "常规课":"tag-blue",
    "重点提升课":"tag-orange",
    "重点提升课候选":"tag-orange",
    "异常课":"tag-red",
    "暂停授课建议":"tag-red",
    "清退复审建议":"tag-red"
  };
  return map[layer] || "tag-gray";
}

function getStatusTagClass(status) {
  const map = {
    "未分配":"tag-gray",
    "待复核":"tag-blue",
    "复核中":"tag-yellow",
    "已完成":"tag-green",
    "需负责人复审":"tag-red"
  };
  return map[status] || "tag-gray";
}

function getScoreClass(score) {
  if(score==null||score===''||isNaN(Number(score))) return 'score-bad';
  score = Number(score);
  if(score>=85) return 'score-high';
  if(score>=60) return 'score-mid';
  if(score>=40) return 'score-low';
  return 'score-bad';
}

function getRiskClass(risk) {
  const map = { low:'risk-low', medium:'risk-medium', high:'risk-high', critical:'risk-critical' };
  return map[risk] || '';
}

function getRiskLabel(risk) {
  const map = { low:'低风险', medium:'中风险', high:'高风险', critical:'严重风险' };
  return map[risk] || '未评估';
}

function getFetchStatusLabel(status) {
  const map = { pending:'待读取', fetching:'读取中', success:'读取成功', failed:'读取失败', none:'无报告链接' };
  return map[status] || status;
}

function getFetchStatusDot(status) {
  return `<span class="status-dot ${status||'pending'}"></span>`;
}

function getDepthLabel(depth) {
  const map = {
    'basic_report_only':'仅基础报告',
    'report_deep_ai':'AI深度分析',
    'video_frame_needed':'需视频复核',
    'audio_transcript_needed':'需音频转写',
    'manual_review_required':'需人工复审'
  };
  return map[depth] || depth;
}

function getDepthClass(depth) {
  const map = {
    'basic_report_only':'depth-basic',
    'report_deep_ai':'depth-deep',
    'video_frame_needed':'depth-video',
    'audio_transcript_needed':'depth-audio',
    'manual_review_required':'depth-manual'
  };
  return map[depth] || 'depth-basic';
}

// =========== AI API CONFIG ===========
const AI_CONFIG_KEY = 'dudao_ai_config';
const DEFAULT_PROXY_URL = 'https://api.allorigins.win/raw?url=';
function getAiConfig() {
  try {
    return JSON.parse(localStorage.getItem(AI_CONFIG_KEY) || '{}');
  } catch(e) { return {}; }
}
function saveAiConfig(cfg) {
  localStorage.setItem(AI_CONFIG_KEY, JSON.stringify(cfg));
}
function getProxyUrl() {
  const cfg = getAiConfig();
  return cfg.proxyUrl || DEFAULT_PROXY_URL;
}

// =========== LOADING STATES ===========
function showLoading(text) {
  let overlay = document.querySelector('.loading-overlay');
  if(!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'loading-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">' + (text || '加载中...') + '</div>';
  overlay.style.display = 'flex';
}

function hideLoading() {
  const overlay = document.querySelector('.loading-overlay');
  if(overlay) overlay.style.display = 'none';
}

function dbStatusHtml() {
  if(dbReady && sbClient) {
    return '<span class="db-status"><span class="dot connected"></span>云端已连接</span>';
  }
  return '<span class="db-status"><span class="dot disconnected"></span>未连接</span>';
}

// =========== SETUP SQL (v0.5 保留 + v1.0 新字段) ===========
const SETUP_SQL = `-- ============= courses 课程表 =============
CREATE TABLE IF NOT EXISTS courses (
  course_id TEXT PRIMARY KEY,
  course_name TEXT,
  subject TEXT,
  teacher_name TEXT,
  teacher_id TEXT,
  class_name TEXT,
  school_name TEXT,
  lesson_time TEXT,
  duration INTEGER,
  ai_score NUMERIC,
  ai_report_url TEXT,
  replay_url TEXT,
  ai_layer TEXT,
  final_layer TEXT DEFAULT '',
  need_review BOOLEAN DEFAULT true,
  need_followup BOOLEAN DEFAULT false,
  assigned_reviewer TEXT DEFAULT '',
  reviewer_token TEXT DEFAULT '',
  review_status TEXT DEFAULT '未分配',
  teacher_feedback TEXT DEFAULT '',
  internal_notes TEXT DEFAULT '',
  created_at TEXT,
  updated_at TEXT,
  -- v1.0 新增字段
  report_fetch_status TEXT DEFAULT 'pending',
  report_fetch_error TEXT DEFAULT '',
  report_raw_text TEXT DEFAULT '',
  report_structured_json JSONB DEFAULT '{}'::jsonb,
  ai_deep_analysis TEXT DEFAULT '',

-- ============= RLS & Admin 体系 =============
ALTER TABLE courses ENABLE ROW LEVEL SECURITY;
ALTER TABLE reviewers ENABLE ROW LEVEL SECURITY;
ALTER TABLE review_logs ENABLE ROW LEVEL SECURITY;
ALTER TABLE import_batches ENABLE ROW LEVEL SECURITY;

CREATE TABLE IF NOT EXISTS admin_uids (
  uid UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  email TEXT,
  created_at TIMESTAMPTZ DEFAULT NOW()
);
ALTER TABLE admin_uids ENABLE ROW LEVEL SECURITY;

CREATE OR REPLACE FUNCTION is_admin()
RETURNS BOOLEAN AS $$
BEGIN
  RETURN EXISTS (SELECT 1 FROM admin_uids WHERE uid = auth.uid());
EXCEPTION WHEN OTHERS THEN RETURN FALSE;
END;
$$ LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path = public;

-- courses 表策略
CREATE POLICY "courses_select_admin" ON courses FOR SELECT TO authenticated USING (is_admin());
CREATE POLICY "courses_insert_admin" ON courses FOR INSERT TO authenticated WITH CHECK (is_admin());
CREATE POLICY "courses_update_admin" ON courses FOR UPDATE TO authenticated USING (is_admin()) WITH CHECK (is_admin());
CREATE POLICY "courses_delete_admin" ON courses FOR DELETE TO authenticated USING (is_admin());

-- reviewers 表策略
CREATE POLICY "reviewers_select_admin" ON reviewers FOR SELECT TO authenticated USING (is_admin());
CREATE POLICY "reviewers_insert_admin" ON reviewers FOR INSERT TO authenticated WITH CHECK (is_admin());
CREATE POLICY "reviewers_update_admin" ON reviewers FOR UPDATE TO authenticated USING (is_admin()) WITH CHECK (is_admin());
CREATE POLICY "reviewers_delete_admin" ON reviewers FOR DELETE TO authenticated USING (is_admin());

-- review_logs 表策略
CREATE POLICY "review_logs_select_admin" ON review_logs FOR SELECT TO authenticated USING (is_admin());

-- ============= 督课官 RPC 函数 =============
CREATE OR REPLACE FUNCTION get_reviewer_info(p_token TEXT)
RETURNS TABLE (reviewer_id TEXT, reviewer_name TEXT, subject TEXT, token TEXT, max_tasks INTEGER, assigned_count INTEGER, completed_count INTEGER, status TEXT) AS $$
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN; END IF;
  RETURN QUERY SELECT r.reviewer_id, r.reviewer_name, r.subject, r.token, r.max_tasks, r.assigned_count, r.completed_count, r.status
    FROM reviewers r WHERE r.token = p_token AND r.status = '启用' LIMIT 1;
  RETURN;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

CREATE OR REPLACE FUNCTION get_reviewer_courses(p_token TEXT)
RETURNS TABLE (course_id TEXT, course_name TEXT, subject TEXT, teacher_name TEXT, teacher_id TEXT, class_name TEXT, school_name TEXT, lesson_time TEXT, duration INTEGER, ai_score NUMERIC, ai_report_url TEXT, replay_url TEXT, ai_layer TEXT, final_layer TEXT, need_review BOOLEAN, need_followup BOOLEAN, assigned_reviewer TEXT, reviewer_token TEXT, review_status TEXT, teacher_feedback TEXT, internal_notes TEXT, created_at TEXT, updated_at TEXT, risk_level TEXT, needs_leader_review BOOLEAN, ai_deep_analysis TEXT) AS $$
DECLARE v_valid BOOLEAN;
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN; END IF;
  SELECT EXISTS (SELECT 1 FROM reviewers WHERE token = p_token AND status = '启用') INTO v_valid;
  IF NOT v_valid THEN RETURN; END IF;
  RETURN QUERY SELECT c.course_id, c.course_name, c.subject, c.teacher_name, c.teacher_id, c.class_name, c.school_name, c.lesson_time, c.duration, c.ai_score, c.ai_report_url, c.replay_url, c.ai_layer, c.final_layer, c.need_review, c.need_followup, c.assigned_reviewer, c.reviewer_token, c.review_status, c.teacher_feedback, c.internal_notes, c.created_at, c.updated_at, c.risk_level, c.needs_leader_review, c.ai_deep_analysis
    FROM courses c WHERE c.reviewer_token = p_token ORDER BY c.created_at DESC;
  RETURN;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

CREATE OR REPLACE FUNCTION submit_review(p_token TEXT, p_course_id TEXT, p_final_layer TEXT, p_need_followup BOOLEAN, p_has_risk BOOLEAN, p_risk_type TEXT, p_teacher_feedback TEXT, p_internal_notes TEXT)
RETURNS BOOLEAN AS $$
DECLARE v_reviewer_name TEXT; v_status TEXT; v_completed_count INTEGER;
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN FALSE; END IF;
  IF p_course_id IS NULL OR p_course_id = '' THEN RETURN FALSE; END IF;
  IF p_final_layer IS NULL OR p_final_layer = '' THEN RETURN FALSE; END IF;
  SELECT reviewer_name INTO v_reviewer_name FROM reviewers WHERE token = p_token AND status = '启用' LIMIT 1;
  IF v_reviewer_name IS NULL THEN RETURN FALSE; END IF;
  IF NOT EXISTS (SELECT 1 FROM courses WHERE course_id = p_course_id AND reviewer_token = p_token) THEN RETURN FALSE; END IF;
  IF p_final_layer IN ('暂停授课建议', '清退复审建议') THEN v_status := '需负责人复审'; ELSE v_status := '已完成'; END IF;
  UPDATE courses SET final_layer = p_final_layer, need_followup = p_need_followup, review_status = v_status, teacher_feedback = COALESCE(p_teacher_feedback, ''), internal_notes = COALESCE(p_internal_notes, ''), updated_at = NOW()::TEXT
    WHERE course_id = p_course_id AND reviewer_token = p_token;
  INSERT INTO review_logs (log_id, course_id, reviewer_name, final_layer, need_followup, has_risk, risk_type, teacher_feedback, internal_notes, submitted_at)
    VALUES ('L' || EXTRACT(EPOCH FROM NOW())::BIGINT::TEXT || '_' || substr(md5(random()::TEXT), 1, 6), p_course_id, v_reviewer_name, p_final_layer, p_need_followup, p_has_risk, COALESCE(p_risk_type, ''), COALESCE(p_teacher_feedback, ''), COALESCE(p_internal_notes, ''), NOW()::TEXT);
  SELECT COUNT(*) INTO v_completed_count FROM courses WHERE reviewer_token = p_token AND review_status IN ('已完成', '需负责人复审');
  UPDATE reviewers SET completed_count = v_completed_count WHERE token = p_token;
  RETURN TRUE;
EXCEPTION WHEN OTHERS THEN RAISE NOTICE 'submit_review error: %', SQLERRM; RETURN FALSE;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

-- ============= 批次计数原子更新函数 =============
CREATE OR REPLACE FUNCTION increment_batch_count(p_batch_id TEXT, p_field TEXT, p_delta INTEGER)
RETURNS BOOLEAN AS $$
DECLARE v_sql TEXT;
BEGIN
  IF p_batch_id IS NULL OR p_batch_id = '' THEN RETURN FALSE; END IF;
  IF p_field NOT IN (
    'fetch_success_count', 'fetch_failed_count',
    'ai_analysis_pending', 'ai_analysis_done', 'ai_analysis_failed',
    'total_rows', 'valid_course_rows'
  ) THEN RETURN FALSE; END IF;

  v_sql := 'UPDATE import_batches SET ' || quote_ident(p_field) || ' = ' || quote_ident(p_field) || ' + $1 WHERE id = $2';
  EXECUTE v_sql USING p_delta, p_batch_id;
  RETURN TRUE;
EXCEPTION WHEN OTHERS THEN
  RAISE NOTICE 'increment_batch_count error: %', SQLERRM;
  RETURN FALSE;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

GRANT EXECUTE ON FUNCTION get_reviewer_info(TEXT) TO anon, authenticated;
GRANT EXECUTE ON FUNCTION get_reviewer_courses(TEXT) TO anon, authenticated;
GRANT EXECUTE ON FUNCTION submit_review(TEXT, TEXT, TEXT, BOOLEAN, BOOLEAN, TEXT, TEXT, TEXT) TO anon, authenticated;
GRANT EXECUTE ON FUNCTION increment_batch_count(TEXT, TEXT, INTEGER) TO authenticated;`;

window.copySql = function() {

    document.body.removeChild(ta);

    setTimeout(() => btn.textContent = '📋 复制 SQL', 2000);

window.testConnection = async function() {
  const url = document.getElementById('cfgUrl').value.trim();
  const key = document.getElementById('cfgKey').value.trim();
  const statusEl = document.getElementById('configStatus');
  if(!url || !key) {
    statusEl.innerHTML = '<div class="config-status error">请填写 Project URL 和 Anon Key</div>';
    return;
  }
  statusEl.innerHTML = '<div class="config-status warning">⏳ 正在测试连接...</div>';
  try {
    const testClient = window.supabase.createClient(url, key);
    const { data, error } = await testClient.rpc('get_reviewer_info', { p_token: 'test-connection-probe' });
    if(error) {
      if(error.message && (error.message.includes('does not exist') || error.message.includes('function') || error.message.includes('relation'))) {
        statusEl.innerHTML = '<div class="config-status warning">连接成功，但 RPC 函数不存在。请先执行建表+RPC SQL。</div>';
      } else {
        statusEl.innerHTML = '<div class="config-status error">连接失败：' + error.message + '</div>';
      }
    } else {
      statusEl.innerHTML = '<div class="config-status success">✅ 连接成功！数据库 RPC 正常。可以保存配置。</div>';
    }
  } catch(e) {
    statusEl.innerHTML = '<div class="config-status error">连接失败：' + e.message + '</div>';
  }
};

window.saveConfig = async function() {
  const url = document.getElementById('cfgUrl').value.trim();
  const key = document.getElementById('cfgKey').value.trim();
  const publicUrl = (document.getElementById('cfgPublicUrl').value || '').trim();
  const statusEl = document.getElementById('configStatus');
  if(!url || !key) {
    statusEl.innerHTML = '<div class="config-status error">请填写 Project URL 和 Anon Key</div>';
    return;
  }
  localStorage.setItem('dudao_sb_url', url);
  localStorage.setItem('dudao_sb_key', key);
  if(publicUrl) localStorage.setItem('dudao_public_url', publicUrl);
  else localStorage.removeItem('dudao_public_url');
  statusEl.innerHTML = '<div class="config-status success">✅ 配置已保存，正在初始化...</div>';
  if(initSupabase()) {
    const route = getRoute();
    if(route.page === 'reviewer') {
      const info = await rpcGetReviewerInfo(route.token);
      dbReady = true;
      setTimeout(() => { render(); }, 300);
    } else {
      dbReady = true;
      setTimeout(() => { render(); }, 300);
    }
  } else {
    statusEl.innerHTML = '<div class="config-status error">初始化失败，请检查配置</div>';
  }
};

// =========== ROUTING ===========
function getRoute() {
  const hash = location.hash || '#admin';
  if(hash.startsWith('#reviewer/')) {
    const tokenPart = hash.replace('#reviewer/','');
    const token = tokenPart.split('?')[0].split('&')[0];
    return { page:'reviewer', token: token };
  }
  return { page:'admin' };
}

// =========== RENDER ENGINE ===========
const app = document.getElementById('app');

async function render() {
  const route = getRoute();
  if(route.page === 'admin') {
    const user = await getAuthUser();
    if(!user) { renderAdminAuthLogin(); return; }
    if(!adminAuthenticated) { renderAdminAuthPwd(); return; }
    await renderAdmin();
  }
  else await renderReviewer(route.token);
}

// --- ClassIn 文件解析（自动定位表头）---
function handleClassInFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  showLoading('正在解析文件...');
  if(ext === 'csv') {
    Papa.parse(file, {
      skipEmptyLines: false,
      complete: result => {
        hideLoading();
        const rows = result.data;
        processClassInRows(rows, file.name);
      },
      error: err => {
        hideLoading();
        alert('CSV解析失败：' + err.message);
      }
    });
  } else if(ext === 'xlsx' || ext === 'xls') {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        // 获取所有行（包括表头前的元信息行）
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        hideLoading();
        processClassInRows(rows, file.name);
      } catch(err) {
        hideLoading();
        alert('Excel解析失败：' + err.message);
      }
    };
    reader.onerror = () => { hideLoading(); alert('文件读取失败'); };
    reader.readAsArrayBuffer(file);
  } else {
    hideLoading();
    alert('不支持的文件格式');
  }
}

function processClassInRows(rows, fileName) {
  // 扫描前10行，寻找表头行（同时含"课堂ID"（含空格变体）+ "课堂名称" + "报告链接"）
  let headerRowIndex = -1;
  for(let i = 0; i < Math.min(rows.length, 10); i++) {
    const row = rows[i] || [];
    // 每个单元格去除 BOM、空格并小写化
    const cells = row.map(c => (c||'').toString().replace(/^\uFEFF/, '').trim().toLowerCase().replace(/\s+/g, ''));
    const rowStr = cells.join('|');
    const hasClassId = rowStr.includes('课堂id') || rowStr.includes('课堂编号');
    const hasClassName = rowStr.includes('课堂名称');
    const hasReportLink = rowStr.includes('报告链接');
    if(hasReportLink && hasClassId && hasClassName && cells.filter(c=>c).length >= 10) {
      headerRowIndex = i;
      break;
    }
  }

  if(headerRowIndex < 0) {
    alert('无法识别表头行，请确认文件为 ClassIn 标准导出格式。\n\n提示：表头行应包含"课堂ID/课堂名称"和"报告链接"等列名。');
    return;
  }

  const headers = rows[headerRowIndex].map(c => (c||'').toString().replace(/^\uFEFF/, '').trim());
  const dataRows = rows.slice(headerRowIndex + 1).filter(r => r && r.some(c => c && c.toString().trim()));

  // 列名映射
  const mapping = {};
  headers.forEach((h, idx) => {
    const field = mapClassInColumn(h);
    if(field) mapping[idx] = { header: h, field: field };
  });

  uploadState.fileName = fileName;
  uploadState.headerRow = headerRowIndex;
  uploadState.rawRows = dataRows;
  uploadState.headers = headers;
  uploadState.mapping = mapping;

  // 预览
  showImportPreview(dataRows, headers, mapping, fileName, headerRowIndex);
}

function mapClassInColumn(header) {
  // 去除 BOM、首尾空格、所有空白字符后小写化，统一匹配
  const h = header.toString().replace(/^\uFEFF/, '').trim().replace(/\s+/g, '').toLowerCase();
  // 精确匹配优先（去掉空格后的标准列名）
  const exactMap = {
    '课堂id': 'classin_class_id',
    '课堂名称': 'classin_class_name',
    '班级id': 'class_id',
    '班级名称': 'class_name',
    '开课时间': 'lesson_time',
    '结束时间': 'end_time',
    '课堂时长': 'duration',
    '教师姓名': 'teacher_name',
    '教师手机号': 'teacher_phone',
    '教师邮箱': 'teacher_email',
    '课堂标签': 'classin_class_label',
    'ai授课分析得分(ai)': 'classin_ai_score',
    '需关注问题(ai)': 'classin_ai_issues',
    '报告链接': 'classin_report_url',
    '回放链接': 'classin_replay_url'
  };
  if(exactMap[h]) return exactMap[h];

  // 模糊匹配
  if(h.includes('课堂') && (h.includes('id')||h.includes('编号'))) return 'classin_class_id';
  if(h.includes('课堂名称') || (h.includes('课堂') && h.includes('名'))) return 'classin_class_name';
  if(h.includes('班级名称') || (h.includes('班级') && h.includes('名'))) return 'class_name';
  if(h.includes('开课时间') || h.includes('上课时间')) return 'lesson_time';
  if(h.includes('结束时间')) return 'end_time';
  if(h.includes('课堂时长') || h.includes('时长')) return 'duration';
  if(h.includes('教师姓名') || h.includes('授课老师') || (h.includes('教师') && h.includes('名'))) return 'teacher_name';
  if(h.includes('教师手机') || h.includes('老师手机') || (h.includes('教师') && h.includes('电话'))) return 'teacher_phone';
  if(h.includes('教师邮箱') || h.includes('老师邮箱') || (h.includes('教师') && h.includes('email'))) return 'teacher_email';
  if(h.includes('课堂标签') || h.includes('标签')) return 'classin_class_label';
  if(h.includes('ai') && h.includes('得分')) return 'classin_ai_score';
  if(h.includes('需关注') || (h.includes('问题') && h.includes('ai'))) return 'classin_ai_issues';
  if(h.includes('报告链接') || h.includes('ai报告')) return 'classin_report_url';
  if(h.includes('回放链接') || h.includes('回放') || h.includes('视频链接')) return 'classin_replay_url';

  return null;
}

          <div style="font-size:20px;font-weight:700;color:var(--color-success)">${previewStats.withReport}</div>
          <div style="font-size:12px;color:var(--color-text-secondary)">有报告链接</div>
        </div>
        <div style="padding:12px;background:var(--color-warning-bg);border-radius:var(--radius-sm);text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--color-warning)">${previewStats.withoutReport}</div>
          <div style="font-size:12px;color:var(--color-text-secondary)">无报告链接</div>
        </div>
        <div style="padding:12px;background:var(--color-purple-bg);border-radius:var(--radius-sm);text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--color-purple)">第 ${headerRowIndex + 1} 行</div>

window.confirmClassInImport = async function() {
  const { rawRows, headers, mapping, fileName } = uploadState;
  if(!rawRows || !mapping) return;

  // ===== Schema 预检：检查 courses 表 v1.0 必需字段是否存在 =====
  const REQUIRED_V1_FIELDS = [
    'ai_action_suggestions','ai_deep_analysis','analysis_depth','ai_analysis_status',
    'ai_analysis_error','report_fetch_status','report_fetch_error','report_raw_text',
    'report_structured_json','risk_level','needs_video_review','needs_audio_transcript',
    'needs_leader_review','subject_detected_from','import_batch_id',
    'classin_class_id','classin_class_name','classin_class_label','classin_ai_score',
    'classin_ai_issues','classin_report_url','classin_replay_url'
  ];
  try {
    const { error } = await sbClient.from('courses')
      .select(REQUIRED_V1_FIELDS.join(','))
      .limit(0);
    if(error) {
      // Postgres error code 42703 = undefined_column
      const pgCode = error.code || (error.error && error.error.code) || '';
      const isMissingCol = pgCode === '42703' ||
        (error.message && (error.message.includes('column') && error.message.includes('does not exist'))) ||
        (error.details && error.details.includes('column'));
      if(isMissingCol) {
        alert('❌ 数据库缺少必需字段\n\n请先在 Supabase SQL Editor 执行 docs/db-migration-v1.0.sql，执行后等待约 1 分钟让 schema cache 自动刷新，再重新导入。\n\n提示：如果刚执行完 SQL，请稍等一分钟再试（schema cache 需要刷新时间）。');
        return;
      }
      // 其他错误（如权限）也提示
      console.error('Schema precheck error:', error);
    }
  } catch(precheckErr) {
    console.warn('Schema precheck exception (non-blocking):', precheckErr);
  }

  // 构建反向映射：field -> column index
  const fieldToIdx = {};
  Object.entries(mapping).forEach(([idx, m]) => { fieldToIdx[m.field] = Number(idx); });

  const batchId = 'B' + Date.now().toString(36) + Math.random().toString(36).substr(2,4);
  const newCourses = [];
  const subjectCount = {};
  let withReport = 0;
  let withoutReport = 0;
  const seenIds = new Set();

  for(const row of rawRows) {
    const getVal = field => {
      const idx = fieldToIdx[field];
      return idx != null ? (row[idx]||'').toString().trim() : '';
    };

    const classId = getVal('classin_class_id');
    if(seenIds.has(classId) && classId) continue; // 去重
    if(classId) seenIds.add(classId);

    const classLabel = getVal('classin_class_label');
    const className = getVal('classin_class_name');
    const classOrClsName = getVal('class_name');
    const { subject, from } = detectSubjectFromFields(classOrClsName, classLabel, className);

    const score = getVal('classin_ai_score');
    const numScore = score !== '' ? Number(score) : null;
    const reportUrl = getVal('classin_report_url');
    const replayUrl = getVal('classin_replay_url');
    const issues = getVal('classin_ai_issues');

    if(reportUrl && reportUrl.trim() !== '') withReport++;
    else withoutReport++;

    if(subject) subjectCount[subject] = (subjectCount[subject]||0) + 1;

    // 规则初筛
    const tempCourse = {
      ai_score: numScore,
      ai_report_url: reportUrl,
      replay_url: replayUrl,
      classin_ai_issues: issues
    };
    const cls = classifyCourse(tempCourse);

    const course = {
      course_id: classId || 'C' + Date.now() + Math.random().toString(36).substr(2,6),
      course_name: className || classOrClsName || '',
      subject: subject,
      subject_detected_from: from,
      teacher_name: getVal('teacher_name'),
      teacher_id: '',
      class_name: classOrClsName || '',
      school_name: '',
      lesson_time: getVal('lesson_time'),
      duration: getVal('duration') ? Number(getVal('duration')) : null,
      ai_score: numScore,
      ai_report_url: reportUrl,
      replay_url: replayUrl,
      ai_layer: cls.layer,
      final_layer: '',
      need_review: cls.layer !== '优秀课候选',
      need_followup: cls.layer === '重点提升课' || cls.layer === '异常课',
      assigned_reviewer: '',
      reviewer_token: '',
      review_status: '未分配',
      teacher_feedback: '',
      internal_notes: '',
      created_at: now(),
      updated_at: now(),
      // v1.0 新字段
      report_fetch_status: (reportUrl && reportUrl.trim() !== '') ? 'pending' : 'none',
      report_fetch_error: '',
      report_raw_text: '',
      report_structured_json: {},
      ai_deep_analysis: '',
      ai_action_suggestions: '',
      ai_analysis_status: cls.depth === 'report_deep_ai' ? 'pending' : 'none',
      ai_analysis_error: '',
      analysis_depth: cls.depth || 'basic_report_only',
      risk_level: cls.risk || '',
      needs_video_review: false,
      needs_audio_transcript: false,
      needs_leader_review: cls.needsLeaderReview || false,
      import_batch_id: batchId,
      classin_class_id: classId,
      classin_class_name: className,
      classin_class_label: classLabel,
      classin_ai_score: numScore,
      classin_ai_issues: issues,
      classin_report_url: reportUrl,
      classin_replay_url: replayUrl
    };
    newCourses.push(course);
  }

  showLoading(`正在导入 ${newCourses.length} 条数据...`);
  try {
    // 1. 写入批次记录
    const batchData = {
      id: batchId,
      file_name: fileName,
      imported_at: now(),
      total_rows: rawRows.length,
      valid_course_rows: newCourses.length,
      rows_with_report_link: withReport,
      rows_without_report_link: withoutReport,
      subject_distribution: JSON.stringify(subjectCount),
      ai_analysis_pending: newCourses.filter(c=>c.analysis_depth === 'report_deep_ai').length,
      ai_analysis_done: 0,
      ai_analysis_failed: 0
    };
    await sbClient.from('import_batches').insert(batchData);

    // 2. 分批写入课程（避免一次插入太多）
    const batchSize = 100;
    for(let i = 0; i < newCourses.length; i += batchSize) {
      const chunk = newCourses.slice(i, i + batchSize);
      const { error } = await sbClient.from('courses').insert(chunk);
      if(error) throw error;
    }

    await loadAllData();
    hideLoading();
    uploadState = { parsedData: null, mapping: null, fileName: '', headerRow: -1 };
    alert(`✅ 导入成功！\n\n共导入 ${newCourses.length} 条课程数据\n有报告链接: ${withReport}\n无报告链接: ${withoutReport}\n科目分布: ${Object.entries(subjectCount).map(([s,c])=>s+':'+c).join('、')}`);
    renderAdmin();
  } catch(e) {
    hideLoading();
    alert('导入失败：' + e.message);
  }

// --- 报告抓取 ---
async function fetchReportContent(url) {
  const proxyUrl = getProxyUrl();
  let lastError = '';

  // 方式一：通过代理请求（优先）
  if(proxyUrl) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);
      const proxiedUrl = proxyUrl + encodeURIComponent(url);
      const resp = await fetch(proxiedUrl, { signal: controller.signal });
      clearTimeout(timeoutId);
      if(!resp.ok) throw new Error('代理返回 HTTP ' + resp.status);
      const text = await resp.text();
      if(text && text.length > 100) {
        return { success: true, text: text, via: 'proxy' };
      }
      lastError = '代理返回内容过短';
    } catch(e) {
      lastError = '代理失败：' + e.message;
      console.warn('[fetchReport] proxy failed:', e.message);
    }
  }

  // 方式二：直连 fetch（回退）
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const resp = await fetch(url, { signal: controller.signal, mode: 'cors' });
    clearTimeout(timeoutId);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    return { success: true, text: text, via: 'direct' };
  } catch(e) {
    const directError = e.message;
    let finalError = lastError ? (lastError + '；直连也失败：' + directError) : directError;
    // 判断是否 CORS 相关
    if(directError.includes('Failed to fetch') || directError.includes('CORS') || directError.includes('NetworkError')) {
      finalError += '（可能因CORS限制，建议使用代理服务器或手动粘贴）';
    }
    return { success: false, error: finalError };
  }
}

// 提取报告主要文本（去除HTML标签，保留正文）
function extractReportText(html) {
  if(!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('script, style, noscript, iframe').forEach(el => el.remove());
  const text = tmp.innerText || tmp.textContent || '';
  return text.replace(/\s+/g, ' ').trim();
}

// 从报告 HTML/文本 中解析结构化信息
function parseReportStructured(html, rawText) {
  const result = {
    score: null,
    issue_summary: null,
    interaction_summary: null,
    teacher_behavior: null,
    student_participation: null,
    raw_sections: []
  };

  let text = rawText || extractReportText(html);
  if(!text) return result;

  // 提取分数（匹配 "得分"、"分数"、"AI 得分" 等 + 数字）
  const scorePatterns = [
    /(?:AI授课分析得分|AI得分|综合得分|总评分|得分|分数)[^0-9]{0,10}(\d{1,3}(?:\.\d{1,2})?)/i,
    /(\d{2,3}(?:\.\d{1,2})?)\s*分/
  ];
  for(const p of scorePatterns) {
    const m = text.match(p);
    if(m) {
      const s = parseFloat(m[1]);
      if(s >= 0 && s <= 100) { result.score = s; break; }
    }
  }

  // 提取章节/模块标题
  const sectionKeywords = ['课堂概况','课堂互动','教师表现','学生参与','教学内容','教学过程','问题反馈','综合评价','需关注问题','亮点','建议'];
  for(const kw of sectionKeywords) {
    if(text.includes(kw)) result.raw_sections.push(kw);
  }
  // 去重
  result.raw_sections = [...new Set(result.raw_sections)];

  // 提取"需关注问题"摘要
  const issueMatch = text.match(/需关注问题[^。！？]{0,200}([^。！？]{20,200})/);
  if(issueMatch) {
    result.issue_summary = issueMatch[1].trim().substring(0, 200);
  } else {
    // 兜底：找包含"问题"的短句
    const issueSentences = text.split(/[。！？\n]/).filter(s => /问题|不足|需关注|风险/.test(s) && s.length > 8 && s.length < 150);
    if(issueSentences.length) {
      result.issue_summary = issueSentences.slice(0, 3).join('；').substring(0, 200);
    }
  }

  // 提取互动摘要
  const interactMatch = text.match(/(?:课堂互动|互动情况|互动参与)[^。！？]{0,50}([^。！？]{20,200})/);
  if(interactMatch) {
    result.interaction_summary = interactMatch[1].trim().substring(0, 200);
  } else {
    const interactSentences = text.split(/[。！？\n]/).filter(s => /互动|提问|回答|举手|参与/.test(s) && s.length > 10 && s.length < 150);
    if(interactSentences.length) {
      result.interaction_summary = interactSentences.slice(0, 3).join('；').substring(0, 200);
    }
  }

  // 教师表现
  const teacherMatch = text.match(/(?:教师表现|教师行为|授课表现|教学状态)[^。！？]{0,50}([^。！？]{20,200})/);
  if(teacherMatch) {
    result.teacher_behavior = teacherMatch[1].trim().substring(0, 200);
  } else {
    const teacherSentences = text.split(/[。！？\n]/).filter(s => /教师|老师|授课|教学/.test(s) && s.length > 10 && s.length < 150);
    if(teacherSentences.length) {
      result.teacher_behavior = teacherSentences.slice(0, 3).join('；').substring(0, 200);
    }
  }

  // 学生参与
  const studentMatch = text.match(/(?:学生参与|学生表现|学生状态|课堂参与)[^。！？]{0,50}([^。！？]{20,200})/);
  if(studentMatch) {
    result.student_participation = studentMatch[1].trim().substring(0, 200);
  } else {
    const studentSentences = text.split(/[。！？\n]/).filter(s => /学生|参与|专注|注意力/.test(s) && s.length > 10 && s.length < 150);
    if(studentSentences.length) {
      result.student_participation = studentSentences.slice(0, 3).join('；').substring(0, 200);
    }
  }

  return result;
}

window.fetchSingleReport = async function(courseId) {
  const course = getCourses().find(c => c.course_id === courseId);
  if(!course || !course.classin_report_url) {
    alert('无报告链接');
    return;
  }

  // 更新状态
  await sbClient.from('courses').update({ report_fetch_status: 'fetching' }).eq('course_id', courseId);
  await refreshData();
  renderAdmin();

  const result = await fetchReportContent(course.classin_report_url);

  if(result.success) {
    const reportText = extractReportText(result.text);
    const structuredJson = parseReportStructured(result.text, reportText);
    await sbClient.from('courses').update({
      report_fetch_status: 'success',
      report_fetch_error: '',
      report_raw_text: reportText.substring(0, 10000),
      report_structured_json: structuredJson
    }).eq('course_id', courseId);
    // 批次统计回写（原子递增）
    if(course.import_batch_id) {
      await sbClient.rpc('increment_batch_count', {
        p_batch_id: course.import_batch_id,
        p_field: 'fetch_success_count',
        p_delta: 1
      }).catch(err => { console.error('increment_batch_count error:', err); });
    }
  } else {
    await sbClient.from('courses').update({
      report_fetch_status: 'failed',
      report_fetch_error: result.error + '（可能因CORS限制，可尝试手动粘贴）'
    }).eq('course_id', courseId);
    // 批次统计回写（原子递增）
    if(course.import_batch_id) {
      await sbClient.rpc('increment_batch_count', {
        p_batch_id: course.import_batch_id,
        p_field: 'fetch_failed_count',
        p_delta: 1
      }).catch(err => { console.error('increment_batch_count error:', err); });
    }
  }

  await refreshData();
  renderAdmin();
};

window.fetchAllPendingReports = async function() {
  const courses = getCourses().filter(c => c.report_fetch_status === 'pending' && c.classin_report_url);
  if(!courses.length) return;
  if(!confirm(`确定批量读取 ${courses.length} 个报告？\n\n注意：受浏览器 CORS 限制，部分链接可能读取失败，可通过"手动粘贴"兜底。`)) return;

  // 顺序读取，避免并发过多
  let success = 0, failed = 0;
  let statsSyncFailed = false;
  for(const c of courses) {
    await sbClient.from('courses').update({ report_fetch_status: 'fetching' }).eq('course_id', c.course_id);
    const result = await fetchReportContent(c.classin_report_url);
    if(result.success) {
      const text = extractReportText(result.text);
      const structuredJson = parseReportStructured(result.text, text);
      await sbClient.from('courses').update({
        report_fetch_status: 'success',
        report_fetch_error: '',
        report_raw_text: text.substring(0, 10000),
        report_structured_json: structuredJson
      }).eq('course_id', c.course_id);
      // 批次统计回写（原子递增）
      if(c.import_batch_id) {
        await sbClient.rpc('increment_batch_count', {
          p_batch_id: c.import_batch_id,
          p_field: 'fetch_success_count',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
      }
      success++;
    } else {
      await sbClient.from('courses').update({
        report_fetch_status: 'failed',
        report_fetch_error: result.error + '（CORS限制，需手动粘贴）'
      }).eq('course_id', c.course_id);
      if(c.import_batch_id) {
        await sbClient.rpc('increment_batch_count', {
          p_batch_id: c.import_batch_id,
          p_field: 'fetch_failed_count',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); statsSyncFailed = true; });
      }
      failed++;
    }
  }

  // 最终统计同步
  await syncBatchStatsFromCourses();
  await refreshData();
  renderAdmin();
  if(statsSyncFailed) {
    showToast('部分批次统计同步失败，可点击批次管理页的刷新统计手动重算', 'error');
  }
  alert(`批量读取完成：成功 ${success} 个，失败 ${failed} 个`);
};

window.retryAllFailedReports = async function() {
  const failed = getCourses().filter(c => c.report_fetch_status === 'failed' && c.classin_report_url);
  if(!failed.length) return;
  if(!confirm(`确定重试 ${failed.length} 个失败的报告？`)) return;
  // 重置为 pending，然后重新批量读取
  for(const c of failed) {
    await sbClient.from('courses').update({ report_fetch_status: 'pending' }).eq('course_id', c.course_id);
    // 批次计数回退（重置时失败计数减一）
    if(c.import_batch_id) {
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: c.import_batch_id,
          p_field: 'fetch_failed_count',
          p_delta: -1
        }).catch(err => { console.error('increment_batch_count error:', err); });
    }
  }
  await refreshData();
  window.fetchAllPendingReports();
};

// --- 批次统计同步工具 ---
async function syncBatchStatsFromCourses() {
  try {
    const batches = getBatches();
    const courses = getCourses();
    for(const b of batches) {
      const batchCourses = courses.filter(c => c.import_batch_id === b.id);
      const fetchSuccess = batchCourses.filter(c => c.report_fetch_status === 'success').length;
      const fetchFailed = batchCourses.filter(c => c.report_fetch_status === 'failed').length;
      const aiDone = batchCourses.filter(c => c.ai_analysis_status === 'success').length;
      const aiFailed = batchCourses.filter(c => c.ai_analysis_status === 'failed').length;
      const aiPending = batchCourses.filter(c => c.ai_analysis_status === 'pending' || c.ai_analysis_status === 'analyzing').length;
      await sbClient.from('import_batches').update({
        fetch_success_count: fetchSuccess,
        fetch_failed_count: fetchFailed,
        ai_analysis_pending: aiPending,
        ai_analysis_done: aiDone,
        ai_analysis_failed: aiFailed
      }).eq('id', b.id).catch(err => { console.error('syncBatchStatsFromCourses update error:', err); });
    }
  } catch(e) {
    console.warn('syncBatchStatsFromCourses error:', e);
  }
}

window.submitPastedReport = async function(courseId) {
  const text = document.getElementById('pasteReportText').value.trim();
  if(!text) { alert('请粘贴报告内容'); return; }
  const structuredJson = parseReportStructured(null, text);
  const course = getCourses().find(c => c.course_id === courseId);
  const oldStatus = course ? course.report_fetch_status : 'pending';
  await sbClient.from('courses').update({
    report_fetch_status: 'success',
    report_fetch_error: '',
    report_raw_text: text.substring(0, 10000),
    report_structured_json: structuredJson
  }).eq('course_id', courseId);
  // 批次统计回写（根据旧状态判断是否需要调整，避免重复计数）
  if(course && course.import_batch_id) {
    if(oldStatus === 'success') {
      // 状态未变化，不调整计数
    } else if(oldStatus === 'failed') {
      // 失败转成功：失败计数-1，成功计数+1
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'fetch_failed_count',
          p_delta: -1
        }).catch(err => { console.error('increment_batch_count error:', err); });
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'fetch_success_count',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
    } else {
      // pending / none / 其他 → 成功：成功计数+1
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'fetch_success_count',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
    }
  }
  await refreshData();
  closeModal();
  renderAdmin();
};

// --- 成本估算 ---
function estimateBatchCost(count) {
  // 按 Moonshot 8K 模型估算：输入约 1500 tokens，输出约 500 tokens
  // 单价约 0.012 元 / 千 tokens（输入） + 0.012 元 / 千 tokens（输出）
  const inputTokens = 1500;
  const outputTokens = 500;
  const costPerCourse = ((inputTokens + outputTokens) / 1000) * 0.012;
  return count * costPerCourse;
}

const AI_SYSTEM_PROMPT = `你是一名专业的在线课堂督课分析师，服务于「童年一课云教室」公益项目。
你的任务是对 ClassIn AI 授课分析报告进行二次深度分析，从教育质量、学生体验、教师成长三个维度给出可执行的建议。

分析原则：
1. 客观中立：基于报告事实分析，不臆测、不夸大
2. 具体可操作：建议必须具体到可以直接给老师反馈
3. 分层归因：区分课程设计问题、教师技能问题、学生因素、技术因素
4. 风险敏感：涉及体罚、辱骂、不当言论、安全隐患等必须标记为高风险
5. 公益导向：教师多为志愿者，建议语气鼓励为主

输出必须是合法 JSON（字段不可缺省）：
{
  "course_summary": "一句话概括本节课整体情况（50字以内）",
  "classin_issues_summary": "对 ClassIn AI 标注的问题进行归纳梳理（100字以内）",
  "ai_second_opinion": "你的二次分析深度意见（150字以内）",
  "risk_level": "low|medium|high|critical",
  "manual_review_issues": ["需要人工复核的问题点列表，每条30字以内"],
  "reviewer_focus_points": ["督课官复核重点方向列表，每条20字以内"],
  "teacher_improvement_suggestions": ["给老师的具体改进建议，每条40字以内"],
  "suggest_video_review": true|false,

  "suggest_leader_review": true|false
}`;

function buildUserPrompt(course) {
  const initialCls = classifyCourse(course);
  const reportText = (course.report_raw_text || '').substring(0, 2500);
  return `请对以下课程的 AI 分析报告进行二次深度分析：

【基本信息】
- 课程名称：${course.course_name || '-'}
- 科目：${course.subject || '-'}
- 授课教师：${course.teacher_name || '-'}
- 班级：${course.class_name || '-'}
- 课程时长：${course.duration || '-'} 分钟
- ClassIn AI 得分：${course.ai_score ?? '-'} / 100
- 课堂标签：${course.classin_class_label || '-'}

【ClassIn AI 标注的问题】
${course.classin_ai_issues || '（无）'}

【AI 报告原文摘要】
${reportText || '（暂无报告文本）'}

【规则初筛结果】
- 初筛分层：${initialCls.layer}

请基于以上信息，输出深度分析结果（JSON 格式）。`;

async function callAiAnalysis(course) {
  const config = getAiConfig();
  if(!config.apiBase || !config.apiKey || !config.model) {
    return { success: false, error: 'AI 模型未配置' };
  }

  const userPrompt = buildUserPrompt(course);
  const messages = [
    { role: 'system', content: AI_SYSTEM_PROMPT },
    { role: 'user', content: userPrompt }
  ];

  // 最多重试 3 次
  let lastError = '';
  for(let attempt = 0; attempt < 3; attempt++) {
    try {
      const url = config.apiBase.replace(/\/$/, '') + '/chat/completions';
      const resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + config.apiKey
        },
        body: JSON.stringify({
          model: config.model,
          messages: messages,
          temperature: 0.3,
          max_tokens: 2048,
          response_format: { type: 'json_object' }
        })
      });

      if(!resp.ok) {
        const errText = await resp.text().catch(()=>'');
        throw new Error('HTTP ' + resp.status + ': ' + errText.substring(0, 100));
      }

      const data = await resp.json();
      const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!content) throw new Error('空响应');

      const result = JSON.parse(content);
      return { success: true, data: result };
    } catch(e) {
      lastError = e.message;
      console.warn('AI 分析失败，第 ' + (attempt+1) + ' 次：', e.message);
      if(attempt < 2) {
        await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
      }
    }
  }
  return { success: false, error: lastError };
}

window.analyzeSingleCourse = async function(courseId) {
  const course = getCourses().find(c => c.course_id === courseId);
  if(!course) return;
  if(course.report_fetch_status !== 'success') {
    alert('请先读取报告内容');
    return;
  }

  // 记录旧状态，避免重复计数（必须在标记为分析中之前）
  const oldAiStatus = course.ai_analysis_status;

  // 标记为分析中
  await sbClient.from('courses').update({
    ai_analysis_status: 'analyzing',
    ai_analysis_error: ''
  }).eq('course_id', courseId);
  await refreshData();
  renderAdmin();

  showLoading('正在进行 AI 深度分析...');
  const result = await callAiAnalysis(course);
  hideLoading();

  if(!result.success) {
    await sbClient.from('courses').update({
      ai_analysis_status: 'failed',
      ai_analysis_error: result.error || '未知错误',
      updated_at: now()
    }).eq('course_id', courseId);
    // 批次回写（根据旧状态避免重复计数）
    if(course.import_batch_id) {
      if(oldAiStatus === 'failed') {
        // 已算过失败，不重复计数
      } else if(oldAiStatus === 'success') {
        // 成功转失败（防御性处理）
        await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_done',
          p_delta: -1
        }).catch(err => { console.error('increment_batch_count error:', err); });
        await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_failed',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
      } else {
        // pending / analyzing → 失败：失败计数+1
        await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_failed',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
      }
    }
    await refreshData();
    renderAdmin();
    alert('AI 分析失败：' + result.error);
    return;
  }

  const aiData = result.data;
  const updates = {
    ai_deep_analysis: (aiData.ai_second_opinion || '').substring(0, 500),
    ai_action_suggestions: JSON.stringify(aiData),
    analysis_depth: 'report_deep_ai',
    ai_analysis_status: 'success',
    ai_analysis_error: '',
    risk_level: aiData.risk_level || course.risk_level || '',
    needs_video_review: !!aiData.suggest_video_review,
    needs_audio_transcript: !!aiData.suggest_audio_transcript,
    needs_leader_review: !!aiData.suggest_leader_review,
    updated_at: now()
  };

  // 如果 AI 认为是 critical 风险，升级分层
  if(aiData.risk_level === 'critical' && course.ai_layer !== '清退复审建议') {
    updates.ai_layer = '异常课';
    updates.needs_leader_review = true;
  } else if(aiData.risk_level === 'high' && course.ai_layer === '常规课') {
    updates.ai_layer = '重点提升课';
  }

  await sbClient.from('courses').update(updates).eq('course_id', courseId);
  // 批次回写（根据旧状态避免重复计数）
  if(course.import_batch_id) {
    if(oldAiStatus === 'success') {
      // 已是成功状态，不重复计数
    } else if(oldAiStatus === 'failed') {
      // 失败转成功：失败-1，成功+1
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_failed',
          p_delta: -1
        }).catch(err => { console.error('increment_batch_count error:', err); });
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_done',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
    } else {
      // pending / analyzing → 成功：成功计数+1
      await sbClient.rpc('increment_batch_count', {
          p_batch_id: course.import_batch_id,
          p_field: 'ai_analysis_done',
          p_delta: 1
        }).catch(err => { console.error('increment_batch_count error:', err); });
    }
  }
  await syncBatchStatsFromCourses();
  await refreshData();
  renderAdmin();
  alert('✅ AI 分析完成');
};

function getAiAnalysisList() {
  const courses = getCourses();
  const sub = adminState.aiSubTab || 'pending';
  if(sub === 'pending') {
    return courses.filter(c => c.analysis_depth === 'report_deep_ai' && !c.ai_deep_analysis);
  } else if(sub === 'analyzing') {
    return courses.filter(c => c.ai_analysis_status === 'analyzing');
  } else if(sub === 'done') {
    return courses.filter(c => c.ai_analysis_status === 'success');
  } else if(sub === 'failed') {
    return courses.filter(c => c.ai_analysis_status === 'failed');
  }
  return courses.filter(c => c.analysis_depth === 'report_deep_ai' && !c.ai_deep_analysis);
}
