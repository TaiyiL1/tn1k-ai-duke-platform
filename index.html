<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI辅助督课工作台 - 童年一课云教室</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-bg:#F6F8FB;
  --color-surface:#FFFFFF;
  --color-text:#152033;
  --color-text-secondary:#637089;
  --color-text-muted:#8C95A6;
  --color-primary:#1677ff;
  --color-primary-hover:#4096ff;
  --color-primary-bg:#e6f4ff;
  --color-border:#E6EAF2;
  --color-border-light:#F0F3F8;
  --color-success:#16A37B;
  --color-success-bg:#f0fdf4;
  --color-warning:#E6A23C;
  --color-warning-bg:#fdf6ec;
  --color-danger:#E53935;
  --color-danger-bg:#fef2f2;
  --color-info:#1677ff;
  --color-info-bg:#e6f4ff;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);
  --spacing-xs:4px;
  --spacing-sm:8px;
  --spacing-md:16px;
  --spacing-lg:24px;
  --spacing-xl:32px;
}
html{font-size:14px;line-height:1.6}
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);min-height:100vh}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;outline:none;font-size:inherit}
button:focus-visible{box-shadow:0 0 0 2px var(--color-primary)}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px var(--color-primary-bg)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--color-border)}
th{font-weight:600;color:var(--color-text-secondary);background:var(--color-bg);position:sticky;top:0;z-index:1;font-size:13px;white-space:nowrap}
td{font-size:13px}
tbody tr:hover{background:var(--color-primary-bg)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.tag-green{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.tag-blue{background:#e6f4ff;color:#1677ff;border:1px solid #bae0ff}
.tag-orange{background:#fff7e6;color:#d46b08;border:1px solid #ffd591}
.tag-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.tag-gray{background:#f5f5f5;color:#8c8c8c;border:1px solid #e8e8e8}
.tag-yellow{background:#fefce8;color:#a16207;border:1px solid #fde68a}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .15s ease;border:1px solid transparent}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn-default{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border)}
.btn-default:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-success{background:var(--color-success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--color-danger);color:#fff}
.btn-danger:hover{background:#c62828}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-link{background:none;color:var(--color-primary);padding:4px 8px;border:none}
.btn-link:hover{background:var(--color-primary-bg)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:13px;background:var(--color-surface);color:var(--color-text);transition:border-color .15s}
.form-textarea{min-height:80px;resize:vertical;line-height:1.6}
.card{background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid var(--color-border-light)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:20px}

/* Header */
.app-header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:0 var(--spacing-lg);height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.app-header h1{font-size:16px;font-weight:700;color:var(--color-text);display:flex;align-items:center;gap:8px}
.app-header h1 .logo-icon{width:28px;height:28px;background:var(--color-primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.role-badge{background:var(--color-primary-bg);color:var(--color-primary);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--spacing-md);margin-bottom:var(--spacing-lg)}
.stat-card{background:var(--color-surface);border-radius:var(--radius-md);padding:16px 20px;border:1px solid var(--color-border-light);box-shadow:var(--shadow-sm)}
.stat-card .stat-label{font-size:12px;color:var(--color-text-muted);margin-bottom:4px}
.stat-card .stat-value{font-size:28px;font-weight:700;font-family:var(--font-mono);line-height:1.2}
.stat-card .stat-value.text-primary{color:var(--color-primary)}
.stat-card .stat-value.text-success{color:var(--color-success)}
.stat-card .stat-value.text-warning{color:var(--color-warning)}
.stat-card .stat-value.text-danger{color:var(--color-danger)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--color-border);margin-bottom:var(--spacing-lg)}
.tab-btn{padding:10px 20px;font-size:13px;font-weight:500;color:var(--color-text-secondary);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--color-primary)}
.tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:var(--spacing-sm);margin-bottom:var(--spacing-md);align-items:center}
.filter-bar .form-select{width:auto;min-width:120px;padding:6px 10px;font-size:12px}
.filter-bar .form-input{width:auto;min-width:120px;padding:6px 10px;font-size:12px}

/* Upload area */
.upload-area{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;transition:all .15s;cursor:pointer;background:var(--color-surface)}
.upload-area:hover,.upload-area.dragover{border-color:var(--color-primary);background:var(--color-primary-bg)}
.upload-area .upload-icon{font-size:40px;margin-bottom:12px;color:var(--color-text-muted)}
.upload-area .upload-text{font-size:14px;color:var(--color-text-secondary);margin-bottom:4px}
.upload-area .upload-hint{font-size:12px;color:var(--color-text-muted)}

/* Preview table */
.preview-table-wrap{max-height:400px;overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);margin:16px 0}
.preview-table-wrap table{font-size:12px}
.preview-table-wrap th{font-size:11px}

/* Table wrapper */
.table-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:13px;color:var(--color-text-secondary)}
.pagination-btns{display:flex;gap:4px}
.pagination-btns button{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-size:13px;display:flex;align-items:center;justify-content:center}
.pagination-btns button:hover{border-color:var(--color-primary);color:var(--color-primary)}
.pagination-btns button.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.pagination-btns button:disabled{opacity:.4;cursor:not-allowed}

/* Task assignment */
.assign-layout{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-lg)}
.assign-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.assign-panel-header{padding:12px 16px;border-bottom:1px solid var(--color-border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.assign-list{max-height:400px;overflow-y:auto;padding:8px}
.assign-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
.assign-item:hover{background:var(--color-primary-bg)}
.assign-item.selected{background:var(--color-primary-bg);border:1px solid var(--color-primary)}
.assign-actions{display:flex;justify-content:center;padding:var(--spacing-md);gap:var(--spacing-sm)}
.reviewer-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--color-border-light)}
.reviewer-item:last-child{border-bottom:none}
.reviewer-info{flex:1}
.reviewer-info .name{font-weight:600;font-size:14px}
.reviewer-info .detail{font-size:12px;color:var(--color-text-muted);margin-top:2px}

/* Reviewer page */
.reviewer-header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:16px var(--spacing-lg)}
.reviewer-header h1{font-size:18px;font-weight:700}
.reviewer-header p{color:var(--color-text-secondary);font-size:13px;margin-top:4px}
.reviewer-content{max-width:1200px;margin:0 auto;padding:var(--spacing-lg)}
.course-detail{max-width:900px;margin:0 auto}
.course-detail .back-btn{margin-bottom:var(--spacing-md)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--spacing-md)}
.info-item{padding:12px 0}
.info-item .info-label{font-size:12px;color:var(--color-text-muted);margin-bottom:4px}
.info-item .info-value{font-size:14px;font-weight:500}
.score-display{font-size:48px;font-weight:800;font-family:var(--font-mono);line-height:1}
.score-display.score-high{color:var(--color-success)}
.score-display.score-mid{color:var(--color-primary)}
.score-display.score-low{color:var(--color-warning)}
.score-display.score-bad{color:var(--color-danger)}
.alert-box{padding:16px 20px;border-radius:var(--radius-md);margin:var(--spacing-md) 0;font-size:13px;line-height:1.8}
.alert-box.alert-warning{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-box.alert-warning strong{color:#78350f}
.switch-group{display:flex;align-items:center;gap:8px}
.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#d1d5db;border-radius:11px;transition:.2s;cursor:pointer}
.switch .slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--color-primary)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.link-box{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--color-primary-bg);color:var(--color-primary);border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-top:8px}
.link-box:hover{text-decoration:none}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-secondary);font-size:12px;cursor:pointer}
.copy-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.token-display{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);word-break:break-all}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:var(--radius-sm);border:none;background:none;font-size:18px;color:var(--color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--color-bg)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:8px}
.empty-state{text-align:center;padding:48px 24px;color:var(--color-text-muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}
.export-options{display:grid;gap:var(--spacing-md)}
.export-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}
.export-item .export-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
.export-item .export-info p{font-size:12px;color:var(--color-text-muted)}
.main-content{padding:var(--spacing-lg);max-width:1400px;margin:0 auto}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-md)}
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .assign-layout{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .filter-bar{flex-direction:column}
  .filter-bar .form-select,.filter-bar .form-input{width:100%}
}
@media print{
  .app-header,.tabs,.filter-bar,.btn,.upload-area{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}
.checkbox-cell{width:40px;text-align:center}
.sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:var(--spacing-sm);font-size:12px;color:var(--color-text-secondary)}
.sort-bar button{font-size:12px;padding:4px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-secondary)}
.sort-bar button:hover,.sort-bar button.active{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-bg)}
.reviewer-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:var(--spacing-sm);background:var(--color-surface);transition:border-color .15s}
.reviewer-card:hover{border-color:var(--color-primary)}
.status-select{padding:4px 8px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:12px}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Config Page Styles */
.config-page{max-width:640px;margin:60px auto;padding:0 var(--spacing-lg)}
.config-page .config-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px}
.config-page .config-subtitle{text-align:center;color:var(--color-text-secondary);font-size:14px;margin-bottom:32px}
.config-page .config-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--color-border-light);padding:32px}
.config-page .config-actions{display:flex;gap:12px;justify-content:center;margin-top:24px}
.config-page .config-status{text-align:center;padding:12px;border-radius:var(--radius-sm);margin-top:16px;font-size:13px}
.config-page .config-status.success{background:var(--color-success-bg);color:var(--color-success)}
.config-page .config-status.error{background:var(--color-danger-bg);color:var(--color-danger)}
.config-page .help-section{margin-top:24px}
.config-page .help-toggle{cursor:pointer;color:var(--color-primary);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;user-select:none}
.config-page .help-toggle:hover{text-decoration:underline}
.config-page .help-content{display:none;margin-top:16px}
.config-page .help-content.open{display:block}
.config-page .help-step{padding:12px 0;border-bottom:1px solid var(--color-border-light);font-size:13px;line-height:1.8}
.config-page .help-step:last-child{border-bottom:none}
.config-page .help-step strong{color:var(--color-text)}
.config-page .sql-block{position:relative;background:#1e1e2e;color:#cdd6f4;border-radius:var(--radius-md);padding:16px;margin:12px 0;font-family:var(--font-mono);font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre}
.config-page .sql-copy-btn{position:absolute;top:8px;right:8px;padding:4px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.1);color:#cdd6f4;border:1px solid rgba(255,255,255,0.2);font-size:11px;cursor:pointer}
.config-page .sql-copy-btn:hover{background:rgba(255,255,255,0.2)}

/* Connection status indicator */
.db-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-muted);padding:2px 10px;border-radius:12px;background:var(--color-bg)}
.db-status .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.db-status .dot.connected{background:#16a34a}
.db-status .dot.disconnected{background:#dc2626}
.db-status .dot.loading{background:#eab308;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:12px}
.loading-spinner{width:36px;height:36px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--color-text-secondary)}

/* Reconfig button in header */
.btn-config{background:none;border:1px solid var(--color-border);color:var(--color-text-muted);padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer}
.btn-config:hover{border-color:var(--color-primary);color:var(--color-primary)}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">AI辅助督课工作台 - 童年一课云教室</h1>
<main id="app"></main>

<script>
// =========== SUPABASE DATA LAYER ===========
let sbClient = null;
let dbReady = false;
let dbCache = { courses: [], reviewers: [], logs: [] };
let dbLoading = false;
// 管理员 Auth 会话状态
let authUser = null;

function initSupabase() {
  const url = localStorage.getItem('dudao_sb_url');
  const key = localStorage.getItem('dudao_sb_key');
  if(url && key) {
    try {
      sbClient = window.supabase.createClient(url, key, {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      });
      return true;
    } catch(e) {
      console.error('Supabase init error:', e);
      return false;
    }
  }
  return false;
}

// =========== AUTH HELPERS ===========
async function getAuthUser() {
  if(!sbClient) return null;
  try {
    const { data } = await sbClient.auth.getUser();
    authUser = data.user;
    return data.user;
  } catch(e) {
    console.error('getAuthUser error:', e);
    return null;
  }
}

async function adminSignIn(email, password) {
  if(!sbClient) return { error: { message: '数据库未初始化' } };
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if(data && data.user) authUser = data.user;
  return { data, error };
}

async function adminSignOut() {
  if(!sbClient) return;
  await sbClient.auth.signOut();
  authUser = null;
}

// =========== REVIEWER RPC (督课官端专用) ===========
// 督课官端完全通过 RPC 函数访问数据，不直接 SELECT 表

async function rpcGetReviewerInfo(token) {
  if(!sbClient || !token) return null;
  try {
    const { data, error } = await sbClient.rpc('get_reviewer_info', { p_token: token });
    if(error) { console.error('rpcGetReviewerInfo error:', error); return null; }
    return data && data.length > 0 ? data[0] : null;
  } catch(e) {
    console.error('rpcGetReviewerInfo exception:', e);
    return null;
  }
}

async function rpcGetReviewerCourses(token) {
  if(!sbClient || !token) return [];
  try {
    const { data, error } = await sbClient.rpc('get_reviewer_courses', { p_token: token });
    if(error) { console.error('rpcGetReviewerCourses error:', error); return []; }
    return data || [];
  } catch(e) {
    console.error('rpcGetReviewerCourses exception:', e);
    return [];
  }
}

async function rpcSubmitReview(token, courseId, finalLayer, needFollowup, hasRisk, riskType, feedback, notes) {
  if(!sbClient || !token) return { success: false, error: '数据库未初始化' };
  try {
    const { data, error } = await sbClient.rpc('submit_review', {
      p_token: token,
      p_course_id: courseId,
      p_final_layer: finalLayer,
      p_need_followup: needFollowup,
      p_has_risk: hasRisk,
      p_risk_type: riskType,
      p_teacher_feedback: feedback,
      p_internal_notes: notes
    });
    if(error) return { success: false, error: error.message };
    return { success: data === true };
  } catch(e) {
    return { success: false, error: e.message };
  }
}

-- 辅助函数：判断当前 authenticated 用户是否为管理员
CREATE OR REPLACE FUNCTION is_admin()
RETURNS BOOLEAN AS $$
BEGIN
  RETURN EXISTS (SELECT 1 FROM admin_uids WHERE uid = auth.uid());
EXCEPTION WHEN OTHERS THEN RETURN FALSE;
END;
$$ LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path = public;

-- ===== 督课官 RPC 函数（SECURITY DEFINER 绕过 RLS，函数内部校验 token）=====

-- 获取督课官信息
CREATE OR REPLACE FUNCTION get_reviewer_info(p_token TEXT)
RETURNS TABLE (reviewer_id TEXT, reviewer_name TEXT, subject TEXT, token TEXT, max_tasks INTEGER, assigned_count INTEGER, completed_count INTEGER, status TEXT) AS $$
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN; END IF;
  RETURN QUERY SELECT r.reviewer_id, r.reviewer_name, r.subject, r.token, r.max_tasks, r.assigned_count, r.completed_count, r.status
    FROM reviewers r WHERE r.token = p_token AND r.status = '启用' LIMIT 1;
  RETURN;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

-- 获取督课官课程列表
CREATE OR REPLACE FUNCTION get_reviewer_courses(p_token TEXT)
RETURNS TABLE (course_id TEXT, course_name TEXT, subject TEXT, teacher_name TEXT, teacher_id TEXT, class_name TEXT, school_name TEXT, lesson_time TEXT, duration INTEGER, ai_score NUMERIC, ai_report_url TEXT, replay_url TEXT, ai_layer TEXT, final_layer TEXT, need_review BOOLEAN, need_followup BOOLEAN, assigned_reviewer TEXT, reviewer_token TEXT, review_status TEXT, teacher_feedback TEXT, internal_notes TEXT, created_at TEXT, updated_at TEXT) AS $$
DECLARE v_valid BOOLEAN;
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN; END IF;
  SELECT EXISTS (SELECT 1 FROM reviewers WHERE token = p_token AND status = '启用') INTO v_valid;
  IF NOT v_valid THEN RETURN; END IF;
  RETURN QUERY SELECT c.course_id, c.course_name, c.subject, c.teacher_name, c.teacher_id, c.class_name, c.school_name, c.lesson_time, c.duration, c.ai_score, c.ai_report_url, c.replay_url, c.ai_layer, c.final_layer, c.need_review, c.need_followup, c.assigned_reviewer, c.reviewer_token, c.review_status, c.teacher_feedback, c.internal_notes, c.created_at, c.updated_at
    FROM courses c WHERE c.reviewer_token = p_token ORDER BY c.created_at DESC;
  RETURN;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

-- 提交复核
CREATE OR REPLACE FUNCTION submit_review(p_token TEXT, p_course_id TEXT, p_final_layer TEXT, p_need_followup BOOLEAN, p_has_risk BOOLEAN, p_risk_type TEXT, p_teacher_feedback TEXT, p_internal_notes TEXT)
RETURNS BOOLEAN AS $$
DECLARE v_reviewer_name TEXT; v_status TEXT; v_completed_count INTEGER;
BEGIN
  IF p_token IS NULL OR p_token = '' THEN RETURN FALSE; END IF;
  IF p_course_id IS NULL OR p_course_id = '' THEN RETURN FALSE; END IF;
  IF p_final_layer IS NULL OR p_final_layer = '' THEN RETURN FALSE; END IF;
  SELECT reviewer_name INTO v_reviewer_name FROM reviewers WHERE token = p_token AND status = '启用' LIMIT 1;
  IF v_reviewer_name IS NULL THEN RETURN FALSE; END IF;
  IF NOT EXISTS (SELECT 1 FROM courses WHERE course_id = p_course_id AND reviewer_token = p_token) THEN RETURN FALSE; END IF;
  IF p_final_layer IN ('暂停授课建议', '清退复审建议') THEN v_status := '需负责人复审'; ELSE v_status := '已完成'; END IF;
  UPDATE courses SET final_layer = p_final_layer, need_followup = p_need_followup, review_status = v_status, teacher_feedback = COALESCE(p_teacher_feedback, ''), internal_notes = COALESCE(p_internal_notes, ''), updated_at = NOW()::TEXT
    WHERE course_id = p_course_id AND reviewer_token = p_token;
  INSERT INTO review_logs (log_id, course_id, reviewer_name, final_layer, need_followup, has_risk, risk_type, teacher_feedback, internal_notes, submitted_at)
    VALUES ('L' || EXTRACT(EPOCH FROM NOW())::BIGINT::TEXT || '_' || substr(md5(random()::TEXT), 1, 6), p_course_id, v_reviewer_name, p_final_layer, p_need_followup, p_has_risk, COALESCE(p_risk_type, ''), COALESCE(p_teacher_feedback, ''), COALESCE(p_internal_notes, ''), NOW()::TEXT);
  SELECT COUNT(*) INTO v_completed_count FROM courses WHERE reviewer_token = p_token AND review_status IN ('已完成', '需负责人复审');
  UPDATE reviewers SET completed_count = v_completed_count WHERE token = p_token;
  RETURN TRUE;
EXCEPTION WHEN OTHERS THEN RAISE NOTICE 'submit_review error: %', SQLERRM; RETURN FALSE;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER SET search_path = public;

-- 授予 anon/authenticated 执行 RPC 函数的权限
GRANT EXECUTE ON FUNCTION get_reviewer_info(TEXT) TO anon, authenticated;

GRANT EXECUTE ON FUNCTION submit_review(TEXT, TEXT, TEXT, BOOLEAN, BOOLEAN, TEXT, TEXT, TEXT) TO anon, authenticated;`;

function classifyByAiScore(score, hasReport, hasReplay) {
  if (!hasReport || !hasReplay) return "异常课";
  if (score === null || score === undefined || score === "") return "异常课";
  score = Number(score);
  if (isNaN(score)) return "异常课";
  if (score >= 83) return "优秀课候选";
  if (score >= 72 && score <= 82) return "常规课";
  if (score <= 71) return "重点提升课候选";
  return "异常课";
}

  return map[layer] || "tag-gray";
}

  const map = {"未分配":"tag-gray","待复核":"tag-blue","复核中":"tag-yellow","已完成":"tag-green","需负责人复审":"tag-red"};
  return map[status] || "tag-gray";
}

function getScoreClass(score) {
  if(score==null||score==='') return 'score-bad';
  score = Number(score);
  if(score>=83) return 'score-high';
  if(score>=72) return 'score-mid';
  if(score<=71) return 'score-low';
  return 'score-bad';
}

// =========== COLUMN MAPPING ===========
const COLUMN_MAP = {
  course_id: ['课程编号','课程id','course_id','编号','课程ID','id'],
  course_name: ['课程名称','课程名','course_name','课程','课名','name'],
  subject: ['科目','学科','subject','课程科目'],
  teacher_name: ['授课老师','老师姓名','teacher_name','教师','老师','teacher'],
  teacher_id: ['志愿者编号','teacher_id','志愿者','教师编号','编号id'],
  class_name: ['班级名称','班级','class_name','班名','class'],
  school_name: ['学校名称','学校','school_name','学校名','school'],
  lesson_time: ['上课时间','课程时间','lesson_time','时间','date','上课日期'],
  duration: ['时长','时长(分钟)','duration','分钟','时长分钟'],
  ai_score: ['AI综合分','AI分数','ai_score','综合分','分数','score','ai分'],
  ai_report_url: ['AI报告链接','AI报告','ai_report_url','报告链接','report_url','报告url'],
  replay_url: ['回放链接','回放','replay_url','回放地址','视频链接','replay']
};

function matchColumn(header) {
  const h = header.trim().toLowerCase();
  for(const [field, aliases] of Object.entries(COLUMN_MAP)) {
    if(aliases.some(a => h === a.toLowerCase() || h.includes(a.toLowerCase()))) return field;
  }
  return null;
}

// =========== ROUTING ===========
function getRoute() {
  const hash = location.hash || '#admin';
  if(hash.startsWith('#reviewer/')) {
    const tokenPart = hash.replace('#reviewer/','');
    // 去掉可能跟随的查询参数（如 ?cfg=xxx）
    const token = tokenPart.split('?')[0].split('&')[0];
    return { page:'reviewer', token: token };
  }
  return { page:'admin' };
}

// =========== RENDER ENGINE ===========
const app = document.getElementById('app');

async function render() {
  const route = getRoute();
  if(route.page === 'admin') {
    // 双层校验：1) Supabase Auth 登录  2) 管理员口令
    const user = await getAuthUser();
    if(!user) { renderAdminAuthLogin(); return; }
    if(!adminAuthenticated) { renderAdminAuthPwd(); return; }
    await renderAdmin();
  }
  else await renderReviewer(route.token);
}

function renderUploadTab(container) {

        </div>
        <div id="uploadPreview"></div>
      </div>
    </div>
  `;

  const area = document.getElementById('uploadArea');
  const input = document.getElementById('fileInput');

  area.addEventListener('click', () => input.click());
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });
}

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'csv') {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: result => { showPreview(result.data, result.meta.fields, file.name); }
    });
  } else if(ext === 'xlsx' || ext === 'xls') {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(data.length) showPreview(data, Object.keys(data[0]), file.name);
    };
    reader.readAsArrayBuffer(file);
  }
}

function showPreview(data, headers, fileName) {
  uploadState.fileName = fileName;
  uploadState.parsedData = data;
  const mapping = {};
  headers.forEach(h => {
    const field = matchColumn(h);
    if(field) mapping[h] = field;
  });
  uploadState.mapping = mapping;

  const preview = document.getElementById('uploadPreview');
  const unmapped = headers.filter(h => !mapping[h]);
  const sampleRows = data.slice(0, 5);

  preview.innerHTML = `
    <div style="margin-top:20px">
      <h4 style="font-size:14px;margin-bottom:12px">📋 文件：${fileName}（共 ${data.length} 条记录）</h4>
      ${unmapped.length ? `<div style="padding:10px 14px;background:var(--color-warning-bg);border:1px solid #fde68a;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px;color:#92400e">
        未匹配的列：${unmapped.join('、')}
      </div>` : ''}
      <div style="margin-bottom:8px;font-size:13px;font-weight:500">列名匹配结果：</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
        ${Object.entries(mapping).map(([col,field])=>`
          <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--color-primary-bg);border-radius:var(--radius-sm);font-size:12px">
            <strong>${col}</strong> → ${field}
          </span>
        `).join('')}
      </div>
      <div class="preview-table-wrap">
        <table>
          <thead><tr>${headers.map(h=>`<th>${h}${mapping[h]?' ✓':''}</th>`).join('')}</tr></thead>
          <tbody>
            ${sampleRows.map(row=>`<tr>${headers.map(h=>`<td>${row[h]||''}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" onclick="confirmImport()">确认导入 ${data.length} 条数据</button>
        <button class="btn btn-default" onclick="cancelUpload()">取消</button>
      </div>
    </div>
  `;
}

window.confirmImport = async function() {
  const data = uploadState.parsedData;
  const mapping = uploadState.mapping;
  if(!data || !mapping) return;

  const reverseMap = {};
  Object.entries(mapping).forEach(([col, field]) => { reverseMap[field] = col; });

  const newCourses = [];
  data.forEach(row => {
    const get = field => {
      const col = reverseMap[field];
      return col ? (row[col] || '').toString().trim() : '';
    };

    const score = get('ai_score');
    const numScore = score !== '' ? Number(score) : null;
    const hasReport = !!get('ai_report_url');
    const hasReplay = !!get('replay_url');

    const course = {
      course_id: get('course_id') || 'C' + Date.now() + Math.random().toString(36).substr(2,4),
      course_name: get('course_name'),
      subject: get('subject'),
      teacher_name: get('teacher_name'),
      teacher_id: get('teacher_id'),
      class_name: get('class_name'),
      school_name: get('school_name'),
      lesson_time: get('lesson_time'),
      duration: get('duration') ? Number(get('duration')) : null,
      ai_score: numScore,
      ai_report_url: get('ai_report_url'),
      replay_url: get('replay_url'),
      ai_layer: classifyByAiScore(numScore, hasReport, hasReplay),
      final_layer: '',
      need_review: true,
      need_followup: false,
      assigned_reviewer: '',
      reviewer_token: '',
      review_status: '未分配',
      teacher_feedback: '',
      internal_notes: '',
      created_at: now(),
      updated_at: now()
    };
    newCourses.push(course);
  });

  showLoading('正在导入数据到云端...');
  const { error } = await sbClient.from('courses').insert(newCourses);
  if(error) {
    hideLoading();
    if(error.message.includes('network') || error.message.includes('fetch')) {
      alert('导入失败：网络连接失败，请检查网络');
    } else {
      alert('导入失败：' + error.message);
    }
    return;
  }
  await loadAllData();
  hideLoading();
  uploadState = { parsedData:null, mapping:null, fileName:'' };
  alert('成功导入 ' + data.length + ' 条课程数据！');
  renderAdmin();
};

window.cancelUpload = function() {
  uploadState = { parsedData:null, mapping:null, fileName:'' };
  document.getElementById('uploadPreview').innerHTML = '';
};

function getFilteredCourses() {
  let courses = getCourses();
  const f = adminState.filters;
  if(f.subject) courses = courses.filter(c=>c.subject===f.subject);
  if(f.ai_layer) courses = courses.filter(c=>c.ai_layer===f.ai_layer);
  if(f.final_layer) courses = courses.filter(c=>c.final_layer===f.final_layer);
  if(f.reviewer) courses = courses.filter(c=>c.assigned_reviewer===f.reviewer);
  if(f.status) courses = courses.filter(c=>c.review_status===f.status);
  if(f.followup === 'yes') courses = courses.filter(c=>c.need_followup);
  if(f.followup === 'no') courses = courses.filter(c=>!c.need_followup);
  if(f.abnormal === 'yes') courses = courses.filter(c=>c.ai_layer==='异常课');

  const sort = adminState.sort;
  if(sort === 'score_desc') courses.sort((a,b)=>(b.ai_score||0)-(a.ai_score||0));
  else if(sort === 'score_asc') courses.sort((a,b)=>(a.ai_score||0)-(b.ai_score||0));
  else if(sort === 'unhandled') courses.sort((a,b)=>(a.review_status==='未分配'?-1:1)-(b.review_status==='未分配'?-1:1));
  else if(sort === 'improve_first') courses.sort((a,b)=>(a.ai_layer==='重点提升课候选'?-1:1)-(b.ai_layer==='重点提升课候选'?-1:1));
  else if(sort === 'abnormal_first') courses.sort((a,b)=>(a.ai_layer==='异常课'?-1:1)-(b.ai_layer==='异常课'?-1:1));

  return courses;
}

  const reviewer = reviewers.find(r=>r.reviewer_id===assignState.selectedReviewerId);
  if(!reviewer) return;

  const courseIds = [...assignState.selectedCourseIds];
  const assigned = courseIds.length;

  showLoading('正在分配任务...');

  // Update courses in batch
  const { error: courseErr } = await sbClient.from('courses').update({
    assigned_reviewer: reviewer.reviewer_name,
    reviewer_token: reviewer.token,
    review_status: '待复核',
    updated_at: now()
  }).in('course_id', courseIds);

  if(courseErr) {
    hideLoading();
    alert('分配失败：' + courseErr.message);
    return;
  }

  // Update reviewer assigned_count
  const newAssignedCount = reviewer.assigned_count + assigned;
  const { error: revErr } = await sbClient.from('reviewers').update({
    assigned_count: newAssignedCount
  }).eq('reviewer_id', reviewer.reviewer_id);

  if(revErr) {
    hideLoading();
    alert('督课官数据更新失败：' + revErr.message);
    return;
  }

  await loadAllData();
  hideLoading();
  assignState.selectedCourseIds.clear();
  assignState.selectedReviewerId = null;
  alert('成功分配 ' + assigned + ' 门课程给 ' + reviewer.reviewer_name);
  renderAdmin();
};

function getConfigQuery() {
  const u = localStorage.getItem('dudao_sb_url');
  const k = localStorage.getItem('dudao_sb_key');
  if(!u || !k) return '';
  const cfg = JSON.stringify({u, k});
  let b64 = btoa(unescape(encodeURIComponent(cfg)));
  b64 = b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return '?cfg=' + b64;
}

window.copyLink = function(token) {
  const url = (localStorage.getItem('dudao_public_url') || (location.origin + location.pathname)) + '#reviewer/' + token + getConfigQuery();
  navigator.clipboard.writeText(url).then(()=>{
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent=orig, 1500);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
};

  }));

function downloadExcel(data, filename) {
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '数据');
  const cols = Object.keys(data[0]||{}).map(k => ({wch: Math.max(k.length*2, ...data.map(r=>(r[k]||'').toString().length))}));
  ws['!cols'] = cols;
  XLSX.writeFile(wb, filename);
}

                <button class="btn btn-default" onclick="reviewerBack()">取消</button>
              </div>
            `}
          </div>
        </div>
      </div>
    </div>
    <div id="modalContainer"></div>
  `;
}

window.reviewerBack = async function() {
  reviewerState.view = 'list';
  reviewerState.currentCourseId = null;
  await render();
};

window.submitReview = async function(courseId, token) {
  const finalLayer = document.getElementById('reviewFinalLayer').value;
  if(!finalLayer) { alert('请选择人工复核分类'); return; }

  const followup = document.getElementById('reviewFollowup').checked;
  const hasRisk = document.getElementById('reviewRisk').checked;
  const riskType = hasRisk ? document.getElementById('reviewRiskType').value.trim() : '';
  const feedback = document.getElementById('reviewFeedback').value.trim();
  const notes = document.getElementById('reviewNotes').value.trim();

  showLoading('正在提交复核结果...');
  // 调用 RPC 函数提交复核（函数内部完成 token 校验、课程归属校验、
  // 更新 courses、插入 review_logs、更新 completed_count 等全部操作）
  const result = await rpcSubmitReview(token, courseId, finalLayer, followup, hasRisk, riskType, feedback, notes);
  hideLoading();

  if(!result.success) {
    alert('提交失败：' + (result.error || '未知错误'));
    return;
  }

  alert('复核提交成功！');
  reviewerBack();
};

// 从 URL hash 中提取并应用 Supabase 配置（用于督课官分享链接）
function applyConfigFromUrl() {
  const hash = location.hash || '';
  // 格式: #reviewer/{token}?cfg={base64url}
  const cfgMatch = hash.match(/[?&]cfg=([^&]+)/);
  if(cfgMatch) {
    try {
      let b64 = cfgMatch[1].replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length % 4) b64 += '=';
      const cfgJson = decodeURIComponent(escape(atob(b64)));
      const cfg = JSON.parse(cfgJson);
      if(cfg.u && cfg.k) {
        localStorage.setItem('dudao_sb_url', cfg.u);
        localStorage.setItem('dudao_sb_key', cfg.k);
        const cleanHash = hash.replace(/[?&]cfg=[^&]+/, '');
        history.replaceState(null, '', cleanHash || '#reviewer/');
        return true;
      }
    } catch(e) {
      console.warn('解析URL配置失败:', e);
    }
  }
  return false;
}

// =========== INIT ===========
async function init() {
  const route = getRoute();

  if(route.page === 'reviewer' && !initSupabase()) {
    applyConfigFromUrl();
  }
  if(!initSupabase()) {
    renderConfigPage();
    return;
  }
  // 测试连接（使用 RPC 函数，anon 角色可执行）
  const result = await rpcGetReviewerInfo('init-connection-check');
  // result 为 null 可能是 token 无效，也可能是 RPC 不存在，这里无法区分
  // 但只要没抛异常就算连通
  dbReady = true;
  // 管理员端：先检查 Auth 会话，再渲染
  // 督课官端：直接渲染（RPC 拉数据）
  if(route.page === 'admin') {
    await getAuthUser();
  }
  render();
}

window.addEventListener('hashchange', async () => { reviewerState = {view:'list',currentCourseId:null}; await render(); });
init();
</script>
